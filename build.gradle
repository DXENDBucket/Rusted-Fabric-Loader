plugins {
    id 'java'
}

subprojects {
    if (path == ':android:local-patcher-core' || path == ':android:local-patcher-cli') {
        repositories {
            google()
            mavenCentral()
        }
    }
}

group = 'io.github.endx'
version = '0.1.0'

ext {
    rustedGameVersion = '1.15'
    rustedMappingsVersion = '1.1'
}

repositories {
    if (project.hasProperty('offlineRuntimeJars')) {
        flatDir { dirs rootProject.file(project.property('offlineRuntimeJars')) }
    } else {
        mavenCentral()
        maven { url = "https://maven.fabricmc.net/" }
        maven { url = "https://repo.spongepowered.org/maven/" }
    }
}

def gameLibJarFile = {
    project.hasProperty('gameLibJar') ? file(project.property('gameLibJar')) : file("libs/game-lib.jar")
}
def mappingsTinyFile = {
    project.hasProperty('mappingsTiny') ? file(project.property('mappingsTiny')) : file("src/main/resources/mappings/mappings.tiny")
}
def namedGameJarFile = {
    project.hasProperty('namedGameJar')
            ? file(project.property('namedGameJar'))
            : layout.buildDirectory.file("rusted-dev/game-lib-named.jar").get().asFile
}

dependencies {
    // Fabric
    implementation "net.fabricmc:fabric-loader:0.18.1"        // 举例
    implementation "net.fabricmc:access-widener:2.1.0"
    implementation "net.fabricmc:tiny-mappings-parser:0.2.2.14"
    implementation "com.google.guava:guava:21.0"
    implementation "com.google.code.gson:gson:2.8.7"

    // ASM
    implementation "org.ow2.asm:asm:9.6"
    implementation "org.ow2.asm:asm-analysis:9.6"
    implementation "org.ow2.asm:asm-commons:9.6"
    implementation "org.ow2.asm:asm-tree:9.6"
    implementation "org.ow2.asm:asm-util:9.6"

    // sponge-mixin
    implementation "net.fabricmc:sponge-mixin:0.13.4+mixin.0.8.5"

    // RW
    compileOnly files({ gameLibJarFile() })
}

configurations {
    namedGameJarElements {
        canBeConsumed = true
        canBeResolved = false
    }
}

test {
    useJUnitPlatform()
}

tasks.register('validateMappings') {
    group = 'verification'
    description = 'Validates Tiny mappings and the Rusted Fabric API mixin configuration.'

    def tinyFile = mappingsTinyFile()
    def mixinConfigFile = project(':rusted-fabric-api').file('src/main/resources/rustedfabricapi.mixins.json')
    def mixinSourceDir = project(':rusted-fabric-api').file('src/main/java/io/github/endx/rustedfabricapi/mixin')
    inputs.file tinyFile
    inputs.file mixinConfigFile
    inputs.dir mixinSourceDir

    doLast {
        def lines = tinyFile.readLines('UTF-8')
        if (lines.isEmpty() || lines[0] != 'tiny\t2\t0\tofficial\tintermediary\tnamed') {
            throw new GradleException("Unexpected Tiny v2 header in ${tinyFile}")
        }

        def currentClass = null
        def mappingKeys = new HashSet<String>()
        def classNames = new HashSet<String>()
        int classCount = 0
        int fieldCount = 0
        int methodCount = 0

        lines.drop(1).eachWithIndex { line, index ->
            int lineNumber = index + 2
            if (line.startsWith('c\t')) {
                def parts = line.split('\t', -1)
                if (parts.length != 4 || parts.drop(1).any { it.isEmpty() }) {
                    throw new GradleException("Malformed class mapping at line ${lineNumber}")
                }
                currentClass = parts[1]
                if (!classNames.add(currentClass)) {
                    throw new GradleException("Duplicate class mapping for ${currentClass}")
                }
                classCount++
                return
            }

            if (line.startsWith('\tf\t') || line.startsWith('\tm\t')) {
                if (currentClass == null) {
                    throw new GradleException("Orphan member mapping at line ${lineNumber}")
                }
                def parts = line.split('\t', -1)
                if (parts.length != 6 || parts.drop(2).any { it.isEmpty() }) {
                    throw new GradleException("Malformed member mapping at line ${lineNumber}")
                }
                def kind = parts[1]
                def key = "${kind}\t${currentClass}\t${parts[3]}\t${parts[2]}"
                if (!mappingKeys.add(key)) {
                    throw new GradleException("Duplicate member mapping at line ${lineNumber}: ${key}")
                }
                if (parts[3] == '<init>' && parts[5] != '<init>') {
                    throw new GradleException("Constructor renamed in the named namespace at line ${lineNumber}")
                }
                if (kind == 'f') fieldCount++ else methodCount++
                return
            }

            if (!line.trim().isEmpty()) {
                throw new GradleException("Unsupported Tiny row at line ${lineNumber}")
            }
        }

        if (classCount < 1440 || fieldCount < 5470 || methodCount < 7880) {
            throw new GradleException("Mapping coverage regressed: classes=${classCount}, fields=${fieldCount}, methods=${methodCount}")
        }

        def config = new groovy.json.JsonSlurper().parse(mixinConfigFile)
        if (config.required != true || config.injectors?.defaultRequire != 1) {
            throw new GradleException('Rusted Fabric API mixins must use strict required/defaultRequire settings')
        }

        def configured = config.mixins as Set
        def namedSources = fileTree(mixinSourceDir) { include '*NamedMixin.java' }.files.collect {
            it.name.substring(0, it.name.length() - '.java'.length())
        } as Set
        def officialSources = fileTree(mixinSourceDir) { include '*OfficialMixin.java' }.files
        if (configured != namedSources) {
            throw new GradleException("Mixin config/source mismatch: missing=${namedSources - configured}, stale=${configured - namedSources}")
        }
        if (!officialSources.isEmpty()) {
            throw new GradleException("Legacy official mixin sources remain: ${officialSources*.name}")
        }

        logger.lifecycle("Validated mappings v${rustedMappingsVersion}: ${classCount} classes, ${fieldCount} fields, ${methodCount} methods; ${configured.size()} mixins")
    }
}

check.dependsOn tasks.named('validateMappings')

tasks.withType(JavaCompile).configureEach {
    options.release = 13 // RW:13
}

jar {
    manifest {
        attributes(
                'Game-Id': 'rusted_warfare',
                'Game-Version': rustedGameVersion,
                'Mappings-Version': rustedMappingsVersion,
                'Implementation-Version': project.version
        )
    }
}

processResources {
    inputs.property 'loaderVersion', project.version
    inputs.property 'gameVersion', rustedGameVersion
    inputs.property 'mappingsVersion', rustedMappingsVersion

    filesMatching('rusted-fabric-loader.properties') {
        expand(
                loaderVersion: project.version,
                gameVersion: rustedGameVersion,
                mappingsVersion: rustedMappingsVersion
        )
    }
}

def remapClasspath = {
    def jars = []
    def libsDir = file("libs")
    if (libsDir.isDirectory()) {
        def inputJar = gameLibJarFile().canonicalFile
        def outputJar = namedGameJarFile().canonicalFile
        jars.addAll(fileTree(libsDir) {
            include "*.jar"
        }.files.findAll { it.canonicalFile != inputJar && it.canonicalFile != outputJar })
    }
    jars.addAll(configurations.runtimeClasspath.files)
    jars
}

tasks.register('generateNamedGameJar', JavaExec) {
    group = 'rusted fabric'
    description = 'Remaps the game jar from official names to named names for mod development. Use -PgameLibJar=... [-PmappingsTiny=...] [-PnamedGameJar=...].'
    dependsOn classes

    inputs.file provider { gameLibJarFile() }
    inputs.file provider { mappingsTinyFile() }
    outputs.file provider { namedGameJarFile() }

    classpath = sourceSets.main.runtimeClasspath
    mainClass.set('io.github.endx.rustedfabricloader.tools.RemapJar')

    doFirst {
        def input = gameLibJarFile()
        if (!input.isFile()) {
            throw new GradleException("Missing game jar: ${input}. Provide one with -PgameLibJar=/path/to/game-lib.jar")
        }
        if (!mappingsTinyFile().isFile()) {
            throw new GradleException("Missing mappings file: ${mappingsTinyFile()}. Provide one with -PmappingsTiny=/path/to/mappings.tiny")
        }

        def output = namedGameJarFile()
        output.parentFile.mkdirs()
        setArgs([
                input.absolutePath,
                output.absolutePath,
                mappingsTinyFile().absolutePath,
                'official',
                'named'
        ] + remapClasspath().collect { it.absolutePath })
    }
}

tasks.register('remapNamedJarToOfficial', JavaExec) {
    group = 'rusted fabric'
    description = 'Remaps a named mod jar back to official runtime names. Use -PremapInput=... [-PremapOutput=...].'
    dependsOn classes, generateNamedGameJar

    classpath = sourceSets.main.runtimeClasspath
    mainClass.set('io.github.endx.rustedfabricloader.tools.RemapJar')

    doFirst {
        if (!project.hasProperty('remapInput')) {
            throw new GradleException('Missing -PremapInput=/path/to/named-mod.jar')
        }

        def input = file(project.property('remapInput'))
        def output = project.hasProperty('remapOutput')
                ? file(project.property('remapOutput'))
                : layout.buildDirectory.file("rusted-dev/remapped/${input.name}").get().asFile
        output.parentFile.mkdirs()

        setArgs([
                input.absolutePath,
                output.absolutePath,
                mappingsTinyFile().absolutePath,
                'named',
                'official',
                namedGameJarFile().absolutePath
        ] + remapClasspath().collect { it.absolutePath })
    }
}

artifacts {
    namedGameJarElements(provider { namedGameJarFile() }) {
        builtBy generateNamedGameJar
    }
}

tasks.register('copyFabricRuntime', Copy) {
    from configurations.runtimeClasspath
    into layout.buildDirectory.dir("fabric-runtime")
}

tasks.register('verifyDistribution') {
    group = 'verification'
    description = 'Builds and validates the named game Jar, provider, official API, and official example-mod artifacts.'
    dependsOn check, jar, generateNamedGameJar, ':rusted-fabric-api:verifyApiContracts',
            ':rusted-fabric-api:remapJarToOfficial', ':example-mod:remapJarToOfficial'

    doLast {
        def providerJar = tasks.jar.archiveFile.get().asFile
        def apiJar = project(':rusted-fabric-api').layout.buildDirectory
                .file("libs/official/rusted-fabric-api-${project.version}.jar").get().asFile
        def exampleJar = project(':example-mod').layout.buildDirectory
                .file("libs/rusted-fabric-example-mod-${project.version}-official.jar").get().asFile
        def namedGameJar = namedGameJarFile()

        [providerJar, apiJar, exampleJar, namedGameJar].each { artifact ->
            if (!artifact.isFile() || artifact.length() == 0L) {
                throw new GradleException("Missing distribution artifact: ${artifact}")
            }
        }

        def readZipText = { java.util.zip.ZipFile zip, String entryName ->
            def entry = zip.getEntry(entryName)
            if (entry == null) throw new GradleException("Missing ${entryName} in ${zip.name}")
            zip.getInputStream(entry).getText('UTF-8')
        }

        new java.util.zip.ZipFile(providerJar).withCloseable { zip ->
            def manifest = new java.util.jar.Manifest(zip.getInputStream(zip.getEntry('META-INF/MANIFEST.MF')))
            def attributes = manifest.mainAttributes
            if (attributes.getValue('Game-Version') != rustedGameVersion.toString()
                    || attributes.getValue('Mappings-Version') != rustedMappingsVersion.toString()
                    || attributes.getValue('Implementation-Version') != project.version.toString()) {
                throw new GradleException('Provider manifest version metadata is inconsistent')
            }
            def properties = new Properties()
            properties.load(zip.getInputStream(zip.getEntry('rusted-fabric-loader.properties')))
            if (properties.getProperty('gameVersion') != rustedGameVersion.toString()
                    || properties.getProperty('mappingsVersion') != rustedMappingsVersion.toString()) {
                throw new GradleException('Provider runtime version metadata is inconsistent')
            }
        }

        new java.util.zip.ZipFile(namedGameJar).withCloseable { zip ->
            def manifestEntry = zip.getEntry('META-INF/MANIFEST.MF')
            if (manifestEntry == null) {
                throw new GradleException('Named game Jar is missing its manifest')
            }
            def manifest = new java.util.jar.Manifest(zip.getInputStream(manifestEntry))
            def mainClass = manifest.mainAttributes.getValue(java.util.jar.Attributes.Name.MAIN_CLASS)
            if (mainClass != 'rustedwarfare.client.RustedWarfareMain'
                    || zip.getEntry(mainClass.replace('.', '/') + '.class') == null) {
                throw new GradleException("Named game Jar has an invalid Main-Class: ${mainClass}")
            }
        }

        new java.util.zip.ZipFile(apiJar).withCloseable { zip ->
            def mod = new groovy.json.JsonSlurper().parseText(readZipText(zip, 'fabric.mod.json'))
            def mixins = new groovy.json.JsonSlurper().parseText(readZipText(zip, 'rustedfabricapi.mixins.json'))
            if (mod.version != project.version.toString()
                    || mod.custom?.get('rustedfabricapi:mappings_version') != rustedMappingsVersion.toString()) {
                throw new GradleException('Official API metadata version is inconsistent')
            }
            def expectedMixinCount = fileTree(project(':rusted-fabric-api').file('src/main/java/io/github/endx/rustedfabricapi/mixin')) {
                include '*NamedMixin.java'
            }.files.size()
            if (mixins.required != true || mixins.injectors?.defaultRequire != 1
                    || mixins.mixins.size() != expectedMixinCount) {
                throw new GradleException('Official API Mixin configuration is not strict or complete')
            }
            [
                    'io/github/endx/rustedfabricapi/api/RustedFabricAPIContext.class',
                    'io/github/endx/rustedfabricapi/api/RustedFabricRuntime.class',
                    'io/github/endx/rustedfabricapi/api/event/RuntimeLifecycleEvents.class'
            ].each { commonEntry ->
                if (zip.getEntry(commonEntry) == null) {
                    throw new GradleException("Portable common API is missing from desktop API: ${commonEntry}")
                }
            }
            mixins.mixins.each { mixin ->
                def entryName = "io/github/endx/rustedfabricapi/mixin/${mixin}.class"
                def entry = zip.getEntry(entryName)
                if (entry == null) throw new GradleException("Missing remapped Mixin class ${entryName}")
                byte[] bytes = zip.getInputStream(entry).bytes
                def constants = new String(bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
                if (constants.contains('rustedwarfare/') || constants.contains('rustedwarfare.')) {
                    throw new GradleException("Named game target remains in official Mixin ${mixin}")
                }
            }
        }

        new java.util.zip.ZipFile(exampleJar).withCloseable { zip ->
            def mod = new groovy.json.JsonSlurper().parseText(readZipText(zip, 'fabric.mod.json'))
            if (mod.version != project.version.toString()) {
                throw new GradleException('Official example-mod metadata version is inconsistent')
            }
        }

        logger.lifecycle("Verified distribution ${project.version} for Rusted Warfare ${rustedGameVersion} / mappings ${rustedMappingsVersion}")
    }
}

def installGameDirFile = {
    project.hasProperty('gameDir') ? file(project.property('gameDir')) : null
}

def installExampleModEnabled = {
    !project.hasProperty('installExampleMod') || project.property('installExampleMod').toString().toBoolean()
}

tasks.register('installToGameDir') {
    group = 'rusted fabric'
    description = 'Installs Fabric runtime jars, the GameProvider, API jar, optional example mod, and the launch script into a Rusted Warfare game directory. Use -PgameDir=... [-PinstallExampleMod=false].'
    dependsOn 'verifyDistribution', 'copyFabricRuntime'

    if (installExampleModEnabled()) {
        dependsOn ':example-mod:remapJarToOfficial'
    }

    doLast {
        def gameDir = installGameDirFile()
        if (gameDir == null) {
            throw new GradleException('Missing -PgameDir=/path/to/Rusted Warfare')
        }
        if (!gameDir.isDirectory()) {
            throw new GradleException("Game directory does not exist: ${gameDir}")
        }

        def javaExe = new File(gameDir, 'jvm64/bin/java.exe')
        if (!javaExe.isFile()) {
            throw new GradleException("Missing bundled Java executable used by the launch script: ${javaExe}")
        }

        def rootGameJar = new File(gameDir, 'game-lib.jar')
        def libsGameJar = new File(gameDir, 'libs/game-lib.jar')
        if (!rootGameJar.isFile() && !libsGameJar.isFile()) {
            throw new GradleException("Missing game-lib.jar in ${rootGameJar} or ${libsGameJar}")
        }

        def fabricLibsDir = new File(gameDir, 'fabric-libs')
        def providerDir = new File(gameDir, 'rusted-fabric-loader')
        def javaModsDir = new File(gameDir, 'javamods')
        [fabricLibsDir, providerDir, javaModsDir].each { it.mkdirs() }

        copy {
            from layout.buildDirectory.dir('fabric-runtime')
            include '*.jar'
            into fabricLibsDir
        }

        copy {
            from tasks.jar.archiveFile.get().asFile
            into providerDir
        }
        def installedProviderJar = new File(providerDir, tasks.jar.archiveFile.get().asFile.name).canonicalFile
        providerDir.eachFileMatch(~/rusted-fabric-loader-.*\.jar/) { candidate ->
            if (candidate.canonicalFile != installedProviderJar) {
                candidate.delete()
            }
        }

        def apiRemapTask = project(':rusted-fabric-api').tasks.named('remapJarToOfficial').get()
        copy {
            from apiRemapTask.outputs.files.singleFile
            into javaModsDir
        }
        def installedApiJar = new File(javaModsDir, apiRemapTask.outputs.files.singleFile.name).canonicalFile
        javaModsDir.eachFileMatch(~/rusted-fabric-api-.*\.jar/) { candidate ->
            if (candidate.canonicalFile != installedApiJar) {
                candidate.delete()
            }
        }

        if (installExampleModEnabled()) {
            def exampleRemapTask = project(':example-mod').tasks.named('remapJarToOfficial').get()
            copy {
                from exampleRemapTask.outputs.files.singleFile
                into javaModsDir
            }
            def installedExampleJar = new File(javaModsDir, exampleRemapTask.outputs.files.singleFile.name).canonicalFile
            javaModsDir.eachFileMatch(~/rusted-fabric-example-mod-.*\.jar/) { candidate ->
                if (candidate.canonicalFile != installedExampleJar) {
                    candidate.delete()
                }
            }
        }

        def launchScript = new File(gameDir, 'run-rusted-fabric.bat')
        launchScript.text = [
                '@echo off',
                'setlocal',
                '',
                'set "JAVA_EXE=jvm64\\bin\\java"',
                'set "HEAP_OPTS=-Xmx4096M"',
                '',
                'rem Fabric Loader and libs',
                'set "FABRIC_CP=fabric-libs/*"',
                '',
                'rem GameProvider',
                'set "GP_CP=rusted-fabric-loader/*"',
                '',
                'set "CLASSPATH=%FABRIC_CP%;%GP_CP%"',
                '',
                '%JAVA_EXE% %HEAP_OPTS% ^',
                '  -verbose:class ^',
                '  -Dfile.encoding=UTF-8 ^',
                '  -cp "%CLASSPATH%" ^',
                '  net.fabricmc.loader.impl.launch.knot.KnotClient ^',
                '  %* > classlog.txt 2>&1',
                '',
                'endlocal',
                'pause'
        ].join(System.lineSeparator()) + System.lineSeparator()

        logger.lifecycle("Installed Rusted Fabric Loader to ${gameDir.absolutePath}")
        logger.lifecycle("  fabric-libs: ${fabricLibsDir.absolutePath}")
        logger.lifecycle("  provider: ${providerDir.absolutePath}")
        logger.lifecycle("  javamods: ${javaModsDir.absolutePath}")
        logger.lifecycle("  launch script: ${launchScript.absolutePath}")
    }
}

