                    'io/github/endx/rustedfabricapi/api/world/GameWorld.class',
                    'io/github/endx/rustedfabricapi/api/world/WorldPoint.class'
            ].each { apiEntry ->
                if (zip.getEntry(apiEntry) == null) {
                    throw new GradleException("Expected API class is missing from desktop API: ${apiEntry}")
                }
            }
            mixins.mixins.each { mixin ->
                def entryName = "io/github/endx/rustedfabricapi/mixin/${mixin.replace('.', '/')}.class"
                def entry = zip.getEntry(entryName)
                if (entry == null) throw new GradleException("Missing remapped Mixin class ${entryName}")
                byte[] bytes = zip.getInputStream(entry).bytes
                def constants = new String(bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
                if (constants.contains('rustedwarfare/') || constants.contains('rustedwarfare.')) {
                    throw new GradleException("Named game target remains in official Mixin ${mixin}")
                }
            }
            [
                    'io/github/endx/rustedfabricapi/mixin/SoundEnginePlaybackNamedMixin.class':
                            'playInterfaceSound(Lcom/corrodinggames/rts/gameFramework/a/i;F)V',
                    'io/github/endx/rustedfabricapi/mixin/accessor/MapEngineAccessor.class':
                            'objectGroups',
                    'io/github/endx/rustedfabricapi/mixin/accessor/DecalBehaviorAccessor.class':
                            'findDecalTemplateStrict'
            ].each { entryName, namedSelector ->
                byte[] bytes = zip.getInputStream(zip.getEntry(entryName)).bytes
                def constants = new String(bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
                if (constants.contains(namedSelector)) {
                    throw new GradleException("Named Mixin selector remains in official class ${entryName}: ${namedSelector}")
                }
            }
            def mappedApiPrefixes = [
                    'io/github/endx/rustedfabricapi/api/asset/',
                    'io/github/endx/rustedfabricapi/api/audio/',
                    'io/github/endx/rustedfabricapi/api/chat/',
                    'io/github/endx/rustedfabricapi/api/client/',
                    'io/github/endx/rustedfabricapi/api/command/',
                    'io/github/endx/rustedfabricapi/api/config/',
                    'io/github/endx/rustedfabricapi/api/custom/',
                    'io/github/endx/rustedfabricapi/api/datagen/',
                    'io/github/endx/rustedfabricapi/api/effect/',
                    'io/github/endx/rustedfabricapi/api/lobby/',
                    'io/github/endx/rustedfabricapi/api/map/',
                    'io/github/endx/rustedfabricapi/api/mission/',
                    'io/github/endx/rustedfabricapi/api/networking/',
                    'io/github/endx/rustedfabricapi/api/projectile/event/',
                    'io/github/endx/rustedfabricapi/api/resource/',
                    'io/github/endx/rustedfabricapi/api/replay/',
                    'io/github/endx/rustedfabricapi/api/registry/',
                    'io/github/endx/rustedfabricapi/api/save/',
                    'io/github/endx/rustedfabricapi/api/scheduler/',
                    'io/github/endx/rustedfabricapi/api/stats/',
                    'io/github/endx/rustedfabricapi/api/text/',
                    'io/github/endx/rustedfabricapi/api/unit/',
                    'io/github/endx/rustedfabricapi/api/world/'
            ]
            zip.entries().each { entry ->
                if (!entry.directory && entry.name.endsWith('.class')
                        && mappedApiPrefixes.any { entry.name.startsWith(it) }) {
                    byte[] bytes = zip.getInputStream(entry).bytes
                    def constants = new String(bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
                    if (constants.contains('rustedwarfare/') || constants.contains('rustedwarfare.')) {
                        throw new GradleException("Named game type remains in official API class ${entry.name}")
                    }
                }
            }
        }

        new java.util.zip.ZipFile(exampleJar).withCloseable { zip ->
            def mod = new groovy.json.JsonSlurper().parseText(readZipText(zip, 'fabric.mod.json'))
            if (mod.id != 'rusted_fabric_example' || mod.version != exampleProject.version.toString()) {
                throw new GradleException('Official example-mod identity or version metadata is inconsistent')
            }
            [
                    'assets/rusted_fabric_example/lang/default.properties',
                    'assets/rusted_fabric_example/lang/en.properties',
                    'assets/rusted_fabric_example/lang/zh.properties',
                    'assets/rusted_fabric_example/lang/zh_cn.properties',
                    'assets/rusted_fabric_example/data/example.properties',
                    'data/rusted_fabric_example/tags/rusted_fabric_example/modes/interactive.json',
                    'data/rusted_fabric_example/tags/rusted_fabric_example/modes/generated_tools.json'
            ].each { resource ->
                if (zip.getEntry(resource) == null) {
                    throw new GradleException("Official example-mod is missing resource ${resource}")
                }
            }
            if (zip.getEntry('io/github/endx/rustedfabricexample/ExampleDataGeneration.class') != null) {
                throw new GradleException('Build-time datagen entrypoint leaked into the runtime example Jar')
            }
            zip.entries().each { entry ->
                if (!entry.directory && entry.name.endsWith('.class')) {
                    byte[] bytes = zip.getInputStream(entry).bytes
                    def constants = new String(bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
                    if (constants.contains('rustedwarfare/') || constants.contains('rustedwarfare.')) {
                        throw new GradleException("Named game type remains in official example class ${entry.name}")
                    }
                }
            }
        }

        new java.util.zip.ZipFile(modMenuJar).withCloseable { zip ->
            def mod = new groovy.json.JsonSlurper().parseText(readZipText(zip, 'fabric.mod.json'))
            if (mod.id != 'java_mod_menu' || mod.version != modMenuProject.version.toString()
                    || zip.getEntry('io/github/endx/javamodmenu/JavaModMenu.class') == null) {
                throw new GradleException('Official Java Mod Menu artifact is incomplete or inconsistent')
            }
        }

        new java.util.zip.ZipFile(iniEssentialsJar).withCloseable { zip ->
            def mod = new groovy.json.JsonSlurper().parseText(readZipText(zip, 'fabric.mod.json'))
            def multiplayer = mod.custom?.get('rusted_fabric:multiplayer')
            if (mod.id != 'ini_essentials' || mod.version != iniEssentialsProject.version.toString()
                    || multiplayer?.mode != 'optional'
                    || !(multiplayer?.syncHash ==~ /[0-9a-f]{64}/)
                    || zip.getEntry('io/github/endx/iniessentials/IniEssentials.class') == null
                    || zip.getEntry('ini_essentials/fields.csv') == null
                    || zip.getEntry('ini_essentials/sync-schema.txt') == null
                    || zip.getEntry('io/github/endx/iniessentials/health/NegativeHpPolicy.class') == null) {
                throw new GradleException('Official INI Essentials artifact is incomplete or inconsistent')
            }
            zip.entries().each { entry ->
                if (!entry.directory && entry.name.endsWith('.class')) {
                    byte[] bytes = zip.getInputStream(entry).bytes
                    def constants = new String(bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
                    if (constants.contains('rustedwarfare/') || constants.contains('rustedwarfare.')) {
                        throw new GradleException("Named game type remains in official INI Essentials class ${entry.name}")
                    }
                }
            }
        }

        new java.util.zip.ZipFile(vulkanModJar).withCloseable { zip ->
            def mod = new groovy.json.JsonSlurper().parseText(readZipText(zip, 'fabric.mod.json'))
            def multiplayer = mod.custom?.get('rusted_fabric:multiplayer')
            if (mod.id != 'vulkan_mod' || mod.version != vulkanModProject.version.toString()
                    || multiplayer?.mode != 'client_only'
                    || zip.getEntry('io/github/endx/vulkanmod/VulkanMod.class') == null
                    || zip.getEntry('META-INF/vulkan-driver/driver-bundle.properties') == null
                    || zip.getEntry('META-INF/THIRD_PARTY_NOTICES.md') == null) {
                throw new GradleException('Official Vulkan Mod artifact is incomplete or inconsistent')
            }
        }

        logger.lifecycle("Verified distribution ${project.version} for Rusted Warfare ${rustedGameVersion} / mappings ${rustedMappingsVersion}")
    }
}

def installGameDirFile = {
    project.hasProperty('gameDir') ? file(project.property('gameDir')) : null
}

def installExampleModEnabled = {
    !project.hasProperty('installExampleMod') || project.property('installExampleMod').toString().toBoolean()
}

def installIniEssentialsEnabled = {
    project.hasProperty('installIniEssentials')
            && project.property('installIniEssentials').toString().toBoolean()
}

tasks.register('installToGameDir') {
    group = 'rusted fabric'
    description = 'Installs Fabric runtime jars, the GameProvider, API, Java Mod Menu, optional official mods, and launch script.'
    dependsOn 'verifyDistribution', 'copyFabricRuntime'

    if (installExampleModEnabled()) {
        dependsOn ':official-mods:example-mod:remapJarToOfficial'
    }

    doLast {
        def gameDir = installGameDirFile()
        if (gameDir == null) {
            throw new GradleException('Missing -PgameDir=/path/to/Rusted Warfare')
        }
        if (!gameDir.isDirectory()) {
            throw new GradleException("Game directory does not exist: ${gameDir}")
        }

        def javaExe = new File(gameDir, 'jvm64/bin/java.exe')
        if (!javaExe.isFile()) {
            throw new GradleException("Missing bundled Java executable used by the launch script: ${javaExe}")
        }

        def rootGameJar = new File(gameDir, 'game-lib.jar')
        def libsGameJar = new File(gameDir, 'libs/game-lib.jar')
        if (!rootGameJar.isFile() && !libsGameJar.isFile()) {
            throw new GradleException("Missing game-lib.jar in ${rootGameJar} or ${libsGameJar}")
        }

        def fabricLibsDir = new File(gameDir, 'fabric-libs')
        def providerDir = new File(gameDir, 'rusted-fabric-loader')
        def javaModsDir = new File(gameDir, 'javamods')
        [fabricLibsDir, providerDir, javaModsDir].each { it.mkdirs() }

        copy {
            from layout.buildDirectory.dir('fabric-runtime')
            include '*.jar'
            into fabricLibsDir
        }

        copy {
            from tasks.jar.archiveFile.get().asFile
            into providerDir
        }
        def installedProviderJar = new File(providerDir, tasks.jar.archiveFile.get().asFile.name).canonicalFile
        providerDir.eachFileMatch(~/rusted-fabric-loader-.*\.jar/) { candidate ->
            if (candidate.canonicalFile != installedProviderJar) {
                candidate.delete()
            }
        }

        def apiRemapTask = project(':rusted-fabric-api').tasks.named('remapJarToOfficial').get()
        copy {
            from apiRemapTask.outputs.files.singleFile
            into javaModsDir
        }
        def installedApiJar = new File(javaModsDir, apiRemapTask.outputs.files.singleFile.name).canonicalFile
        javaModsDir.eachFileMatch(~/rusted-fabric-api-.*\.jar/) { candidate ->
            if (candidate.canonicalFile != installedApiJar) {
                candidate.delete()
            }
        }

        def modMenuRemapTask = project(':official-mods:java-mod-menu').tasks.named('remapJarToOfficial').get()
        copy {
            from modMenuRemapTask.outputs.files.singleFile
            into javaModsDir
        }
        def installedModMenuJar = new File(javaModsDir, modMenuRemapTask.outputs.files.singleFile.name).canonicalFile
        javaModsDir.eachFileMatch(~/(?:rusted-fabric-mod-menu|java-mod-menu)-.*\.jar/) { candidate ->
            if (candidate.canonicalFile != installedModMenuJar) {
                candidate.delete()
            }
        }

        if (installIniEssentialsEnabled()) {
            def iniRemapTask = project(':official-mods:ini-essentials').tasks.named('remapJarToOfficial').get()
            copy {
                from iniRemapTask.outputs.files.singleFile
                into javaModsDir
            }
            def installedIniJar = new File(javaModsDir, iniRemapTask.outputs.files.singleFile.name).canonicalFile
            javaModsDir.eachFileMatch(~/ini-essentials-.*\.jar/) { candidate ->
                if (candidate.canonicalFile != installedIniJar) {
                    candidate.delete()
                }
            }
        }

        if (installExampleModEnabled()) {
            def exampleRemapTask = project(':official-mods:example-mod').tasks.named('remapJarToOfficial').get()
            copy {
                from exampleRemapTask.outputs.files.singleFile
                into javaModsDir
            }
            def installedExampleJar = new File(javaModsDir, exampleRemapTask.outputs.files.singleFile.name).canonicalFile
            javaModsDir.eachFileMatch(~/rusted-fabric-example-mod-.*\.jar/) { candidate ->
                if (candidate.canonicalFile != installedExampleJar) {
                    candidate.delete()
                }
            }
        }

        def launchScript = new File(gameDir, 'run-rusted-fabric.bat')
        launchScript.text = [
                '@echo off',
                'setlocal',
                '',
                'set "JAVA_EXE=jvm64\\bin\\java"',
                'set "HEAP_OPTS=-Xmx4096M"',
                '',
                'rem Fabric Loader and libs',
                'set "FABRIC_CP=fabric-libs/*"',
                '',
                'rem GameProvider',
                "set \"GP_CP=rusted-fabric-loader\\rusted-fabric-loader-${project.version}.jar\"",
                '',
                'set "CLASSPATH=%FABRIC_CP%;%GP_CP%"',
                '',
                '%JAVA_EXE% %HEAP_OPTS% ^',
                '  -verbose:class ^',
                '  -Dfile.encoding=UTF-8 ^',
                '  -cp "%CLASSPATH%" ^',
                '  net.fabricmc.loader.impl.launch.knot.KnotClient ^',
                '  %* > classlog.txt 2>&1',
                '',
                'endlocal',
                'pause'
        ].join(System.lineSeparator()) + System.lineSeparator()

        logger.lifecycle("Installed Rusted Fabric Loader to ${gameDir.absolutePath}")
        logger.lifecycle("  fabric-libs: ${fabricLibsDir.absolutePath}")
        logger.lifecycle("  provider: ${providerDir.absolutePath}")
        logger.lifecycle("  javamods: ${javaModsDir.absolutePath}")
        logger.lifecycle("  launch script: ${launchScript.absolutePath}")
    }
}

