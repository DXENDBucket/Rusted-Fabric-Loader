    description = 'Builds the same official Java mods offered by the Windows installer.'
    workingDir repositoryRoot
    commandLine System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('win')
            ? [new File(repositoryRoot, 'gradlew.bat').absolutePath,
               ':rusted-fabric-api:remapJarToOfficial',
               ':official-mods:java-mod-menu:remapJarToOfficial',
               ':official-mods:ini-essentials:remapJarToOfficial',
               ':official-mods:performance-profiler:remapJarToOfficial']
            : [new File(repositoryRoot, 'gradlew').absolutePath,
               ':rusted-fabric-api:remapJarToOfficial',
               ':official-mods:java-mod-menu:remapJarToOfficial',
               ':official-mods:ini-essentials:remapJarToOfficial',
               ':official-mods:performance-profiler:remapJarToOfficial']
    inputs.files(fileTree(new File(repositoryRoot, 'rusted-fabric-api/src')),
            fileTree(new File(repositoryRoot, 'official-mods/java-mod-menu/src')),
