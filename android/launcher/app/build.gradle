plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.endx.rustedfabric.android.launcher'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.endx.rustedfabric.android.launcher'
        minSdk 27
        targetSdk 35
        versionCode 25
        versionName '0.14.3'

        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -Wall -Wextra -Werror'
                arguments "-DRUSTED_FABRIC_ROCKET_SOURCE=${file("$buildDir/generated/rocketSources/libRocket").absolutePath}",
                        "-DRUSTED_FABRIC_FREETYPE_SOURCE=${file("$buildDir/generated/rocketSources/freetype").absolutePath}",
                        "-DRUSTED_FABRIC_FREETYPE_LIBRARY=${file("$buildDir/generated/lwjglNatives/arm64-v8a/libfreetype.so").absolutePath}"
            }
        }
    }

    ndkVersion '27.2.12479018'

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            // v0.1.0 publicly shipped the .debug application ID with this machine's debug
            // certificate. Keep both identities for in-place upgrades while producing a
            // non-debuggable release build. A future signing-key migration needs its own plan.
            applicationIdSuffix '.debug'
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    packaging {
        jniLibs {
            // The embedded HotSpot VM resolves LWJGL/GL4ES from java.library.path and cannot
            // dlopen libraries directly from an APK zip entry.
            useLegacyPackaging true
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

dependencies {
    implementation project(':jvm-launcher-core')
}

