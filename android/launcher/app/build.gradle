tasks.register('prepareComplianceAssets') {
    group = 'build setup'
    description = 'Packages GPLv3 source and license information for the Android distribution.'
    inputs.file(rootProject.file('LICENSE'))
    inputs.file(rootProject.file('SOURCE_OFFER.md'))
    inputs.file(rootProject.file('../../THIRD_PARTY_NOTICES.md'))
    inputs.file(rootProject.file('../../DISCLAIMER.md'))
    inputs.property('androidVersion', android.defaultConfig.versionName)
    inputs.property('fclVersion', fclReleaseVersion)
    outputs.dir(generatedComplianceAssets)
    // Git commit and dirty state can change without a tracked file input.
    outputs.upToDateWhen { false }

    doLast {
        File repository = rootProject.file('../..')
        def git = { String... arguments ->
            List<String> command = ['git', '-C', repository.absolutePath]
            command.addAll(arguments as List<String>)
            Process process = new ProcessBuilder(command).redirectErrorStream(true).start()
            String output = process.inputStream.getText('UTF-8').trim()
            if (process.waitFor() != 0) {
                return null
            }
            return output
        }

        String revision = git('rev-parse', 'HEAD') ?: 'unknown'
        String status = git('status', '--porcelain')
        String sourceRevision = revision
        if (status == null || !status.isEmpty()) {
            sourceRevision += '-dirty'
        }

        File output = generatedComplianceAssets.get().dir('rusted-fabric').asFile
        project.delete(output)
        File licenses = new File(output, 'licenses')
        licenses.mkdirs()
        project.copy {
            from rootProject.file('LICENSE')
            into licenses
            rename { 'Rusted-Fabric-Android-GPL-3.0.txt' }
        }
        project.copy {
            from rootProject.file('../../THIRD_PARTY_NOTICES.md')
            into output
        }
        project.copy {
            from rootProject.file('../../DISCLAIMER.md')
            into output
        }

        String sourceOffer = rootProject.file('SOURCE_OFFER.md').getText('UTF-8')
                .replace('@ANDROID_VERSION@', android.defaultConfig.versionName)
                .replace('@SOURCE_REVISION@', sourceRevision)
                .replace('@GIT_COMMIT@', revision)
                .replace('@FCL_VERSION@', fclReleaseVersion)
        new File(output, 'SOURCE_OFFER.md').setText(sourceOffer, 'UTF-8')
    }
}

tasks.register('prepareLwjglAndroidRuntime') {
    group = 'build setup'
    description = 'Fetches a coherent SHA-256-pinned FCL LWJGL runtime and GL4ES.'
    outputs.dir(generatedLwjglAssets)
    outputs.dir(generatedLwjglNatives)
    doLast {
        def sha256 = { File file ->
            java.security.MessageDigest.getInstance('SHA-256')
                    .digest(file.bytes).encodeHex().toString()
        }
        def download = { String url, File destination, String expectedSha256 ->
            destination.parentFile.mkdirs()
            if (destination.isFile() && sha256(destination).equalsIgnoreCase(expectedSha256)) {
                return
            }
            File staging = new File(destination.parentFile, destination.name + '.downloading')
            staging.delete()
            String curl = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('win')
                    ? 'curl.exe' : 'curl'
            Process process = new ProcessBuilder(curl, '--fail', '--location', '--retry', '3',
                    '--connect-timeout', '30', '--max-time', '900',
                    '--user-agent', 'Rusted-Fabric-Loader-Gradle',
                    '--output', staging.absolutePath, url)
                    .inheritIO().start()
            if (process.waitFor() != 0) {
                staging.delete()
                throw new GradleException("Could not download ${destination.name}")
            }
            String actual = sha256(staging)
            if (!actual.equalsIgnoreCase(expectedSha256)) {
                staging.delete()
                throw new GradleException(
                        "SHA-256 mismatch for ${destination.name}: ${actual}")
            }
            java.nio.file.Files.move(staging.toPath(), destination.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }

        File fclApk = fclReleaseApk.get().asFile
        download(fclReleaseUrl, fclApk, fclReleaseSha256)
        new java.util.zip.ZipFile(fclApk).withCloseable { zip ->
            fclLwjglEntries.each { artifact ->
                File destination = artifact.asset
                        ? generatedLwjglAssets.get().file("rusted-fabric/${artifact.name}").asFile
                        : generatedLwjglNatives.get().file("arm64-v8a/${artifact.name}").asFile
                destination.parentFile.mkdirs()
                def entry = zip.getEntry(artifact.path)
                if (entry == null) {
                    throw new GradleException(
                            "FCL ${fclReleaseVersion} is missing ${artifact.path}")
                }
                File staging = new File(destination.parentFile, destination.name + '.extracting')
                staging.delete()
                zip.getInputStream(entry).withCloseable { input ->
                    staging.withOutputStream { output -> input.transferTo(output) }
                }
                String actual = sha256(staging)
                if (!actual.equalsIgnoreCase(artifact.sha256)) {
                    staging.delete()
                    throw new GradleException(
                            "SHA-256 mismatch for FCL entry ${artifact.path}: ${actual}")
                }
                java.nio.file.Files.move(staging.toPath(), destination.toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            }
        }

        lwjglAndroidArtifacts.each { artifact ->
            File destination = artifact.asset
                    ? generatedLwjglAssets.get().file("rusted-fabric/${artifact.name}").asFile
                    : generatedLwjglNatives.get().file("arm64-v8a/${artifact.name}").asFile
            download(artifact.url ?: lwjglAndroidBase + artifact.path,
                    destination, artifact.sha256)
        }
    }
}

tasks.register('prepareRocketSources') {
    group = 'build setup'
    description = 'Fetches SHA-256-pinned libRocket and FreeType source used by the ARM64 UI bridge.'
    inputs.property('libRocketCommit', 'bd47356a678ef61b38f4b34dda8e7840bfee0983')
    inputs.property('libRocketAbsoluteInsetsPatch', 'v1')
    inputs.property('libRocketDeferredTextGeometryPatch', 'v1')
    inputs.property('freetypeVersion', '2.13.3')
    outputs.dir(generatedRocketSources)
    doLast {
        def sha256 = { File file ->
            java.security.MessageDigest.getInstance('SHA-256')
                    .digest(file.bytes).encodeHex().toString()
        }
        def sources = [
                [name: 'libRocket',
                 url: 'https://github.com/libRocket/libRocket/archive/bd47356a678ef61b38f4b34dda8e7840bfee0983.tar.gz',
                 archive: layout.buildDirectory.file('vendorDownloads/libRocket-bd47356.tar.gz').get().asFile,
                 sha256: 'BA05C2D8ED1D9997F416C928505D196C13D8865EFD989A36FED08A5E07A23F23'],
                [name: 'freetype',
                 url: 'https://github.com/freetype/freetype/archive/refs/tags/VER-2-13-3.tar.gz',
                 archive: layout.buildDirectory.file('vendorDownloads/freetype-2.13.3.tar.gz').get().asFile,
                 sha256: 'BC5C898E4756D373E0D991BAB053036C5EB2AA7C0D5C67E8662DDC6DA40C4103']
        ]
        String curl = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('win')
                ? 'curl.exe' : 'curl'
        String tar = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('win')
                ? 'tar.exe' : 'tar'
        sources.each { source ->
            source.archive.parentFile.mkdirs()
            if (!source.archive.isFile()
                    || !sha256(source.archive).equalsIgnoreCase(source.sha256)) {
                File staging = new File(source.archive.parentFile,
                        source.archive.name + '.downloading')
                staging.delete()
                Process download = new ProcessBuilder(curl, '--fail', '--location', '--retry', '3',
                        '--connect-timeout', '30', '--max-time', '300',
                        '--user-agent', 'Rusted-Fabric-Loader-Gradle',
                        '--output', staging.absolutePath, source.url)
                        .inheritIO().start()
                if (download.waitFor() != 0) {
                    staging.delete()
                    throw new GradleException("Could not download ${source.name} source")
                }
                String actual = sha256(staging)
                if (!actual.equalsIgnoreCase(source.sha256)) {
                    staging.delete()
                    throw new GradleException(
                            "SHA-256 mismatch for ${source.name} source: ${actual}")
                }
                java.nio.file.Files.move(staging.toPath(), source.archive.toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            }
            File destination = generatedRocketSources.get().dir(source.name).asFile
            project.delete(destination)
            destination.mkdirs()
            Process extraction = new ProcessBuilder(tar, '-xzf', source.archive.absolutePath,
                    '--strip-components=1', '-C', destination.absolutePath)
                    .inheritIO().start()
            if (extraction.waitFor() != 0) {
                project.delete(destination)
                throw new GradleException("Could not extract ${source.name} source")
            }
            if (source.name == 'libRocket') {
                File layoutEngine = new File(destination, 'Source/Core/LayoutEngine.cpp')
                List<String> lines = layoutEngine.readLines('UTF-8')
                int autoHeight = lines.findIndexOf {
                    it.contains('// If the height is set to auto, then any margins also set to auto')
                }
                if (autoHeight < 0) {
                    throw new GradleException('Pinned libRocket automatic height block was not found')
                }
                lines.addAll(autoHeight, [
                        '\t// CSS 2.1: an absolutely-positioned auto-height box with both vertical',
                        '\t// insets specified fills the remaining height of its containing block.',
                        '\t// This is required by the game UI scroll panels (top: 0; bottom: 30px).',
                        '\tif (height_auto && (element->GetPosition() == POSITION_ABSOLUTE ||',
                        '\t\telement->GetPosition() == POSITION_FIXED))',
                        '\t{',
                        '\t\tconst Property* top = element->GetLocalProperty(TOP);',
                        '\t\tconst Property* bottom = element->GetLocalProperty(BOTTOM);',
                        '\t\tif (top != NULL && top->unit != Property::KEYWORD &&',
                        '\t\t\tbottom != NULL && bottom->unit != Property::KEYWORD)',
                        '\t\t{',
                        '\t\t\tcontent_area.y = containing_block_height',
                        '\t\t\t\t- element->ResolveProperty(top, containing_block_height)',
                        '\t\t\t\t- element->ResolveProperty(bottom, containing_block_height)',
                        '\t\t\t\t- box.GetCumulativeEdge(Box::CONTENT, Box::TOP)',
                        '\t\t\t\t- box.GetCumulativeEdge(Box::CONTENT, Box::BOTTOM);',
                        '\t\t\tcontent_area.y = Math::Max(0.0f, content_area.y);',
                        '\t\t\theight_auto = false;',
                        '\t\t}',
                        '\t}',
                        ''
                ])
                layoutEngine.setText(
                        lines.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')

                // libRocket 1.3 generates glyph geometry synchronously while laying out each
                // line. A font-family change during dynamic document construction can therefore
                // pair a layer-configuration index with the previous FontFaceHandle. The RmlUi
                // successor fixed this by deferring geometry generation until OnRender:
                // https://github.com/mikke89/RmlUi/commit/48fa0e46a382a415d31234bb2063757cf3aa1066
                File elementText = new File(destination, 'Source/Core/ElementTextDefault.cpp')
                String elementTextSource = elementText.getText('UTF-8')
                String immediateGeometry = '''\tGenerateGeometry(font_face_handle, lines.back());
\tgeometry_dirty = false;'''
                String deferredGeometry = '''\tgeometry_dirty = true;'''
                if (!elementTextSource.contains(immediateGeometry)) {
                    throw new GradleException(
                            'Pinned libRocket immediate text geometry block was not found')
                }
                elementText.setText(
                        elementTextSource.replace(immediateGeometry, deferredGeometry), 'UTF-8')
            }
        }
    }
}

