plugins {
    id 'java-library'
}

group = 'io.github.endx'
version = '0.1.0'

dependencies {
    implementation 'org.apache.commons:commons-compress:1.28.0'
    implementation 'org.tukaani:xz:1.12'
    implementation 'com.google.code.gson:gson:2.8.7'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 13
    options.encoding = 'UTF-8'
}

tasks.register('verifyJvmLauncherContracts', JavaExec) {
    group = 'verification'
    description = 'Verifies desktop-game inspection and embedded-JVM launch planning.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass.set('io.github.endx.rustedfabric.android.jvm.JvmLauncherCoreVerification')
}

tasks.register('inspectDesktopGame', JavaExec) {
    group = 'verification'
    description = 'Inspects a user-owned desktop game directory passed with -PdesktopGameDir.'
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass.set('io.github.endx.rustedfabric.android.jvm.DesktopGameProbe')
    doFirst {
        if (!providers.gradleProperty('desktopGameDir').isPresent()) {
            throw new GradleException('Pass -PdesktopGameDir=<Rusted Warfare directory>')
        }
        args providers.gradleProperty('desktopGameDir').get()
    }
}

tasks.register('importDesktopGameArchive', JavaExec) {
    group = 'verification'
    description = 'Imports a user-owned desktop game ZIP into an empty directory for workstation verification.'
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass.set('io.github.endx.rustedfabric.android.jvm.DesktopGameArchiveCli')
    doFirst {
        if (!providers.gradleProperty('desktopGameArchive').isPresent()
                || !providers.gradleProperty('desktopGameOutput').isPresent()) {
            throw new GradleException('Pass -PdesktopGameArchive=<zip> and -PdesktopGameOutput=<empty directory>')
        }
        args providers.gradleProperty('desktopGameArchive').get(),
                providers.gradleProperty('desktopGameOutput').get()
    }
}

tasks.register('inspectJvmRuntime', JavaExec) {
    group = 'verification'
    description = 'Validates an extracted Linux AArch64 Java 17 runtime passed with -PjvmRuntimeDir.'
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass.set('io.github.endx.rustedfabric.android.jvm.JvmRuntimeProbeCli')
    doFirst {
        if (!providers.gradleProperty('jvmRuntimeDir').isPresent()) {
            throw new GradleException('Pass -PjvmRuntimeDir=<extracted Java runtime directory>')
        }
        args providers.gradleProperty('jvmRuntimeDir').get()
    }
}

tasks.register('importJvmRuntimeArchive', JavaExec) {
    group = 'verification'
    description = 'Imports a JVM ZIP/TAR.XZ into an empty directory for workstation verification.'
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass.set('io.github.endx.rustedfabric.android.jvm.JvmRuntimeArchiveCli')
    doFirst {
        if (!providers.gradleProperty('jvmRuntimeArchive').isPresent()
                || !providers.gradleProperty('jvmRuntimeOutput').isPresent()) {
            throw new GradleException('Pass -PjvmRuntimeArchive=<archive> and -PjvmRuntimeOutput=<empty directory>')
        }
        args providers.gradleProperty('jvmRuntimeArchive').get(),
                providers.gradleProperty('jvmRuntimeOutput').get()
    }
}

tasks.register('verifyNoGamePayload') {
    group = 'verification'
    description = 'Rejects game files and platform runtime binaries from the JVM launcher core.'
    dependsOn jar
    inputs.file(tasks.jar.archiveFile)
    doLast {
        def forbidden = []
        new java.util.zip.ZipFile(tasks.jar.archiveFile.get().asFile).withCloseable { zip ->
            zip.entries().each { entry ->
                def name = entry.name.toLowerCase(Locale.ROOT)
                if (name.endsWith('.apk') || name.endsWith('.dex') || name.endsWith('.dll')
                        || name.endsWith('.so') || name.endsWith('game-lib.jar')
                        || name.startsWith('com/corrodinggames/')) {
                    forbidden.add(entry.name)
                }
            }
        }
        if (!forbidden.isEmpty()) {
            throw new GradleException("JVM launcher core contains forbidden payloads: ${forbidden}")
        }
    }
}

check.dependsOn tasks.named('verifyJvmLauncherContracts')
check.dependsOn tasks.named('verifyNoGamePayload')
