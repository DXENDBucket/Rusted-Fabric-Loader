plugins {
    id 'java-library'
}

group = 'io.github.endx'
version = '0.1.0'

tasks.withType(JavaCompile).configureEach {
    options.release = 13
    options.encoding = 'UTF-8'
}

jar {
    archiveFileName = 'rusted-fabric-lwjgl2-compat.jar'
}

tasks.register('verifyLwjgl2Compat') {
    group = 'verification'
    dependsOn jar
    doLast {
        new java.util.zip.ZipFile(tasks.jar.archiveFile.get().asFile).withCloseable { zip ->
            if (zip.getEntry('org/lwjgl/Sys.class') == null) {
                throw new GradleException('LWJGL2 compatibility JAR is missing org.lwjgl.Sys')
            }
            if (zip.getEntry('net/java/openjdk/cacio/ctc/ExternalMouseReader.class') == null
                    || zip.getEntry('net/java/openjdk/cacio/ctc/InfdevGrabHandler.class') == null) {
                throw new GradleException('LWJGL2 compatibility JAR is missing Cacio mouse shims')
            }
            if (zip.getEntry('org/lwjgl/system/RustedFabricMemory.class') == null) {
                throw new GradleException('LWJGL2 compatibility JAR is missing the Android buffer bridge')
            }
            if (zip.getEntry('org/lwjgl/system/RustedFabricTouch.class') == null) {
                throw new GradleException('LWJGL2 compatibility JAR is missing the touch bridge')
            }
            if (zip.getEntry('org/lwjgl/system/RustedFabricStorage.class') == null) {
                throw new GradleException('LWJGL2 compatibility JAR is missing the storage bridge')
            }
        }
    }
}

tasks.register('verifyStorageBridge', JavaExec) {
    group = 'verification'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass.set('org.lwjgl.system.RustedFabricStorageVerification')
}

check.dependsOn tasks.named('verifyLwjgl2Compat')
check.dependsOn tasks.named('verifyStorageBridge')
