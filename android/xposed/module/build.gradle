plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.endx.rustedfabric.android.xposed'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.endx.rustedfabric.android.xposed'
        minSdk 27
        targetSdk 35
        versionCode 8
        versionName '0.9.0-rfh1'

        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -Wall -Wextra -Werror'
            }
        }
    }

    ndkVersion '27.2.12479018'

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    packaging {
        resources {
            merges += ['META-INF/xposed/*']
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

dependencies {
    implementation project(':bootstrap-core')
    implementation project(':mod-runtime')
    implementation project(':rusted-fabric-api-android')
    implementation project(':local-patcher-core')
    implementation project(':jvm-launcher-core')
    compileOnly 'io.github.libxposed:api:102.0.0@aar'
}

def generatedPatcherAssets = layout.buildDirectory.dir('generated/localPatcherAssets')
def generatedJvmSmokeAssets = layout.buildDirectory.dir('generated/jvmSmokeAssets')

android.sourceSets.main.assets.srcDir(generatedPatcherAssets)
android.sourceSets.main.assets.srcDir(generatedJvmSmokeAssets)

tasks.register('preparePatchedBootstrapAsset', Copy) {
    dependsOn ':patched-bootstrap:exportBootstrapDex'
    from(project(':patched-bootstrap').layout.buildDirectory
            .file('outputs/rusted-fabric/patched-bootstrap.dex'))
    into(generatedPatcherAssets.map { it.dir('rusted-fabric') })
}

tasks.register('prepareJvmSmokeAsset', Copy) {
    dependsOn ':jvm-launcher-core:verifyNoGamePayload'
    from(provider {
        project(':jvm-launcher-core').tasks.named('jar').get().archiveFile.get().asFile
    })
    into(generatedJvmSmokeAssets.map { it.dir('rusted-fabric') })
    rename { 'jvm-host-smoke.jar' }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('preparePatchedBootstrapAsset')
    dependsOn tasks.named('prepareJvmSmokeAsset')
}

tasks.register('verifyNoGamePayload') {
    group = 'verification'
    description = 'Scans the debug module APK for Rusted Warfare class descriptors and packaged game files.'
    dependsOn 'assembleDebug'

    doLast {
        def apk = fileTree(layout.buildDirectory.dir('outputs/apk/debug')) {
            include '*.apk'
        }.singleFile
        def forbidden = []
        def commonContextFound = false
        def commonEventsFound = false
        def commonModEntrypointFound = false
        def androidModLoaderFound = false
        def modManagerFound = false
        def modProviderFound = false
        def enabledModClientFound = false
        def patcherCoreFound = false
        def bootstrapAssetFound = false
        def handshakeBridgeFound = false
        def androidBackendFound = false
        def sessionApiFound = false
        def gameplayEventsFound = false
        def frameProjectileEventsFound = false
        def jvmBackendFound = false
        def jvmHostFound = false
        def renderBridgeFound = false
        def jvmSmokeAssetFound = false
        new java.util.zip.ZipFile(apk).withCloseable { zip ->
            zip.entries().each { entry ->
                def lower = entry.name.toLowerCase(Locale.ROOT)
                if (lower.startsWith('com/corrodinggames/') || lower.endsWith('.game-apk')) {
                    forbidden.add(entry.name)
                }
                if (entry.name == 'lib/arm64-v8a/librustedfabric_jvmhost.so') {
                    jvmHostFound = true
                }
                if (entry.name == 'lib/arm64-v8a/librustedfabric_renderbridge.so') {
                    renderBridgeFound = true
                }
                if (entry.name == 'assets/rusted-fabric/jvm-host-smoke.jar') {
                    jvmSmokeAssetFound = true
                }
                if (lower.endsWith('.dex')) {
                    def bytes
                    zip.getInputStream(entry).withCloseable { input ->
                        bytes = input.bytes
                    }
                    def dexText = new String(bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
                    def auditedDexText = dexText.replace(
                            'Lcom/corrodinggames/rts/appFramework/RWApplication;', '')
                    if (auditedDexText.contains('Lcom/corrodinggames/rts/')) {
                        forbidden.add("${entry.name}: game class descriptor")
                    }
                    if (dexText.contains('RWApplication.java')) {
                        forbidden.add("${entry.name}: compile-only game stub definition")
                    }
                    if (dexText.contains('Lnet/fabricmc/')
                            || dexText.contains('Lorg/spongepowered/')
                            || dexText.contains('Lorg/newdawn/slick/')) {
                        forbidden.add("${entry.name}: desktop platform descriptor")
                    }
                    commonContextFound |= dexText.contains(
                            'Lio/github/endx/rustedfabricapi/api/RustedFabricAPIContext;')
                    commonEventsFound |= dexText.contains(
                            'Lio/github/endx/rustedfabricapi/api/event/RuntimeLifecycleEvents;')
                    commonModEntrypointFound |= dexText.contains(
                            'Lio/github/endx/rustedfabricapi/api/RustedFabricModEntrypoint;')
                    androidModLoaderFound |= dexText.contains(
                            'Lio/github/endx/rustedfabric/android/xposed/mod/AndroidDexModLoader;')
                    modManagerFound |= dexText.contains(
                            'Lio/github/endx/rustedfabric/android/xposed/ui/ModManagerActivity;')
                    modProviderFound |= dexText.contains(
                            'Lio/github/endx/rustedfabric/android/xposed/storage/ModContentProvider;')
                    enabledModClientFound |= dexText.contains(
                            'Lio/github/endx/rustedfabric/android/xposed/mod/EnabledModClient;')
                    patcherCoreFound |= dexText.contains(
                            'Lio/github/endx/rustedfabric/android/patcher/LocalApkPatcher;')
                    handshakeBridgeFound |= dexText.contains(
                            'Lio/github/endx/rustedfabricapi/api/multiplayer/MultiplayerNetworkBridge;')
                    androidBackendFound |= dexText.contains(
                            'Lio/github/endx/rustedfabricapi/android/AndroidMultiplayerTransport;')
                    sessionApiFound |= dexText.contains(
                            'Lio/github/endx/rustedfabricapi/api/session/GameSession;')
                    gameplayEventsFound |= dexText.contains(
                            'Lio/github/endx/rustedfabricapi/api/event/UnitLifecycleEvents;')
                            && dexText.contains(
                            'Lio/github/endx/rustedfabricapi/api/event/CommandEvents;')
                    frameProjectileEventsFound |= dexText.contains(
                            'Lio/github/endx/rustedfabricapi/android/AndroidGameEventBridge;')
                            && dexText.contains(
                            'Lio/github/endx/rustedfabricapi/api/event/ProjectileEvents;')
                            && dexText.contains(
                            'Lio/github/endx/rustedfabricapi/api/thread/GameThreadScheduler;')
                    jvmBackendFound |= dexText.contains(
                            'Lio/github/endx/rustedfabric/android/jvm/JvmLaunchPlan;')
                    if (entry.name == 'assets/rusted-fabric/patched-bootstrap.dex') {
                        bootstrapAssetFound = dexText.contains(
                                'Lio/github/endx/rustedfabric/android/patched/PatchedApplication;')
                    }
                }
            }
        }
        if (!commonContextFound || !commonEventsFound || !commonModEntrypointFound
                || !androidModLoaderFound || !modManagerFound || !modProviderFound
                || !enabledModClientFound || !patcherCoreFound || !bootstrapAssetFound
                || !handshakeBridgeFound || !androidBackendFound || !sessionApiFound
                || !gameplayEventsFound || !frameProjectileEventsFound || !jvmBackendFound
                || !jvmHostFound || !renderBridgeFound || !jvmSmokeAssetFound) {
            throw new GradleException('Xposed APK is missing the portable API or mod management path')
        }
        if (!forbidden.isEmpty()) {
            throw new GradleException("Xposed APK contains forbidden game payloads: ${forbidden}")
        }
    }
}
