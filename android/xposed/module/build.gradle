        [path: 'app_pojavlauncher/src/main/assets/components/lwjgl3/lwjgl-glfw-classes.jar',
         name: 'lwjgl-glfw-classes.jar',
         sha256: '1BF89A90CBCC0BB4BD07511AFC92E8345FF221D2A7AB1A04F2FCBC1BD09A3FFD',
         asset: true],
        [path: 'app_pojavlauncher/src/main/jniLibs/arm64-v8a/libgl4es_114.so',
         name: 'libgl4es_114.so',
         sha256: '3DBCC87BAAE1436F2AFFB923EDA053D7E256F0AA032654452E2B2092566F6B24'],
        [path: 'app_pojavlauncher/src/main/jniLibs/arm64-v8a/liblwjgl.so',
         name: 'liblwjgl.so',
         sha256: '7CD38E1550505F47A941476A8BA8BE0E2341822D1D66309FC7C8AFB8B6AB5C37'],
        [path: 'app_pojavlauncher/src/main/jniLibs/arm64-v8a/liblwjgl_opengl.so',
         name: 'liblwjgl_opengl.so',
         sha256: '2E5B83ED440507A928306F955DB73D48261A33D55F131D665DF329ECB7B664E7'],
        [path: 'LICENSE', name: 'licenses/PojavLauncher-LGPL-3.0.txt',
