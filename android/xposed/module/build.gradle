plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.endx.rustedfabric.android.xposed'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.endx.rustedfabric.android.xposed'
        minSdk 27
        targetSdk 35
        versionCode 8
        versionName '0.9.0-rfh1'

        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -Wall -Wextra -Werror'
            }
        }
    }

    ndkVersion '27.2.12479018'

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    packaging {
        resources {
            merges += ['META-INF/xposed/*']
        }
        jniLibs {
            // The embedded HotSpot VM resolves LWJGL/GL4ES from java.library.path and cannot
            // dlopen libraries directly from an APK zip entry.
            useLegacyPackaging true
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

dependencies {
    implementation project(':bootstrap-core')
    implementation project(':mod-runtime')
    implementation project(':rusted-fabric-api-android')
    implementation project(':local-patcher-core')
    implementation project(':jvm-launcher-core')
    compileOnly 'io.github.libxposed:api:102.0.0@aar'
}

def generatedPatcherAssets = layout.buildDirectory.dir('generated/localPatcherAssets')
def generatedJvmSmokeAssets = layout.buildDirectory.dir('generated/jvmSmokeAssets')
def generatedLwjglAssets = layout.buildDirectory.dir('generated/lwjglAssets')
def generatedLwjglNatives = layout.buildDirectory.dir('generated/lwjglNatives')

def lwjglAndroidRevision = 'b12ad048157b3aa255d078c235dd4571e1900309'
def lwjglAndroidBase = "https://raw.githubusercontent.com/PojavLauncherTeam/PojavLauncher/${lwjglAndroidRevision}/"
