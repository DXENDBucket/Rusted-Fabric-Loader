pluginManagement {
    repositories {
        google()
        mavenCentral()
        maven { url = uri('https://maven.fabricmc.net/') }
        maven { url = uri('https://repo.spongepowered.org/maven/') }
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url = uri('https://maven.fabricmc.net/') }
        maven { url = uri('https://repo.spongepowered.org/maven/') }
        // API 102 is currently published by libxposed as an official release AAR.
        ivy {
            url = uri('https://github.com/libxposed/api/releases/download')
            patternLayout {
                artifact('[revision]/[artifact]-[revision].[ext]')
            }
            metadataSources {
                artifact()
            }
            content {
                includeModule('io.github.libxposed', 'api')
            }
        }
    }
}

rootProject.name = 'rusted-fabric-android-xposed'
include ':module'
include ':bootstrap-core'
project(':bootstrap-core').projectDir = file('../bootstrap-core')
include ':mod-runtime'
project(':mod-runtime').projectDir = file('../mod-runtime')
include ':rusted-fabric-api'
project(':rusted-fabric-api').projectDir = file('../../rusted-fabric-api')
include ':rusted-fabric-api-android'
project(':rusted-fabric-api-android').projectDir = file('../../rusted-fabric-api-android')
include ':patched-bootstrap'
project(':patched-bootstrap').projectDir = file('../patched-bootstrap')
include ':game-api-stubs'
project(':game-api-stubs').projectDir = file('../game-api-stubs')
include ':local-patcher-core'
project(':local-patcher-core').projectDir = file('../local-patcher-core')
include ':jvm-launcher-core'
project(':jvm-launcher-core').projectDir = file('../jvm-launcher-core')
include ':jvm-game-provider'
project(':jvm-game-provider').projectDir = file('../jvm-game-provider')
include ':lwjgl2-compat'
project(':lwjgl2-compat').projectDir = file('../lwjgl2-compat')
