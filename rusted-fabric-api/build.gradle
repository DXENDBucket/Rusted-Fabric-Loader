                'io/github/endx/rustedfabricapi/api/unit/',
                'io/github/endx/rustedfabricapi/api/world/'
        ]
        def stale = []
        new java.util.zip.ZipFile(outputJar.get().asFile).withCloseable { zip ->
            zip.entries().each { entry ->
                if (entry.name.endsWith('.class')
                        && inspectedPrefixes.any { entry.name.startsWith(it) }) {
                    def constants = new String(zip.getInputStream(entry).bytes,
                            java.nio.charset.StandardCharsets.ISO_8859_1)
