plugins {
    id 'java-library'
}

group = 'io.github.endx'
version = rootProject.version

java {
    withSourcesJar()
}

repositories {
    if (rootProject.hasProperty('offlineRuntimeJars')) {
        flatDir { dirs rootProject.file(rootProject.property('offlineRuntimeJars')) }
    } else {
        mavenCentral()
        maven { url = "https://maven.fabricmc.net/" }
        maven { url = "https://repo.spongepowered.org/maven/" }
    }
}

def gameLibJarFile = {
    rootProject.hasProperty('gameLibJar') ? rootProject.file(rootProject.property('gameLibJar')) : rootProject.file("libs/game-lib.jar")
}
def namedGameJarFile = {
    rootProject.hasProperty('namedGameJar')
            ? rootProject.file(rootProject.property('namedGameJar'))
            : rootProject.layout.buildDirectory.file("rusted-dev/game-lib-named.jar").get().asFile
}
def mappingsTinyFile = {
    rootProject.hasProperty('mappingsTiny')
            ? rootProject.file(rootProject.property('mappingsTiny'))
            : rootProject.file("src/main/resources/mappings/mappings.tiny")
}

dependencies {
    implementation "net.fabricmc:fabric-loader:0.18.1"
    api "com.google.code.gson:gson:2.8.7"
    compileOnly "net.fabricmc:sponge-mixin:0.13.4+mixin.0.8.5"
    compileOnly files({ gameLibJarFile() })
    compileOnly files({ namedGameJarFile() })
    testImplementation files({ namedGameJarFile() })
}

jar {
    archiveBaseName.set('rusted-fabric-api')
    duplicatesStrategy = DuplicatesStrategy.FAIL
}

tasks.named('sourcesJar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.FAIL
}

tasks.register('verifyMappedApiContracts', JavaExec) {
    group = 'verification'
    description = 'Runs dependency-light behavior checks for the mapped game API.'
    dependsOn testClasses, rootProject.tasks.named('generateNamedGameJar')
    classpath = sourceSets.test.runtimeClasspath
    mainClass.set('io.github.endx.rustedfabricapi.verification.MappedApiContractVerification')
}

tasks.register('verifyCoreApiContracts', JavaExec) {
    group = 'verification'
    description = 'Verifies API context, event ordering, lifecycle, and listener isolation.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass.set('io.github.endx.rustedfabricapi.verification.CoreApiContractVerification')
}

tasks.register('verifyApiContracts', JavaExec) {
    group = 'verification'
    description = 'Runs the complete public API event and context contracts.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass.set('io.github.endx.rustedfabricapi.ApiContractVerification')
}

tasks.register('verifyGameApiContracts', JavaExec) {
    group = 'verification'
    description = 'Verifies stable unit/team views, queries, operations, and typed adapters.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass.set('io.github.endx.rustedfabricapi.verification.GameApiContractVerification')
}

tasks.register('verifyApiSupportMatrix') {
    group = 'verification'
    description = 'Validates capability keys and their package-relative public API classes.'
    def matrixFile = file('src/main/resources/rustedfabricapi/api-support-matrix.csv')
    def apiDirectory = file('src/main/java/io/github/endx/rustedfabricapi/api')
    def capabilitySource = file('src/main/java/io/github/endx/rustedfabricapi/api/RustedFabricCapabilities.java')
    inputs.file(matrixFile)
    inputs.dir(apiDirectory)
    inputs.file(capabilitySource)

    doLast {
        def lines = matrixFile.readLines('UTF-8')
        if (lines.isEmpty() || lines[0] != 'capability,apiClass') {
            throw new GradleException('Unexpected API capability catalog schema')
        }
        def capabilities = new LinkedHashSet<String>()
        def matrixClasses = new LinkedHashSet<String>()
        def missingClasses = new LinkedHashSet<String>()
        lines.drop(1).findAll { !it.trim().isEmpty() && !it.startsWith('#') }.eachWithIndex { row, index ->
            def fields = row.split(',', -1)
            if (fields.length != 2 || !fields[0].matches('[a-z][a-z0-9._-]*\\.v[0-9]+')
                    || !fields[1].matches('[A-Za-z_][A-Za-z0-9_.]*')) {
                throw new GradleException("Malformed API capability row ${index + 2}: ${row}")
            }
            if (!capabilities.add(fields[0]) || !matrixClasses.add(fields[1])) {
                throw new GradleException("Duplicate API capability row ${index + 2}: ${row}")
            }
            def apiClassFile = new File(apiDirectory, fields[1].replace('.', '/') + '.java')
            if (!apiClassFile.isFile()) missingClasses.add(fields[1])
        }
        if (!missingClasses.isEmpty()) {
            throw new GradleException("API capability catalog references missing classes: ${missingClasses}")
        }
        def constants = capabilitySource.getText('UTF-8')
        capabilities.each { capability ->
            if (!constants.contains('"' + capability + '"')) {
                throw new GradleException("API capability has no public constant: ${capability}")
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    dependsOn rootProject.tasks.named('generateNamedGameJar')
    options.release = 13 // RW:13
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mappingsVersion', rootProject.rustedMappingsVersion

    filesMatching('fabric.mod.json') {
        expand(
                version: project.version,
                mappingsVersion: rootProject.rustedMappingsVersion
        )
    }
}

tasks.register('remapJarToOfficial', JavaExec) {
    group = 'rusted fabric'
    description = 'Remaps the Rusted Fabric API from named names to official runtime names, including mixin metadata.'
    dependsOn jar, rootProject.tasks.named('classes'), rootProject.tasks.named('generateNamedGameJar')

    classpath = rootProject.sourceSets.main.runtimeClasspath
    mainClass.set('io.github.endx.rustedfabricloader.tools.RemapJar')

    def outputJar = layout.buildDirectory.file("libs/official/rusted-fabric-api-${project.version}.jar")
    inputs.file(tasks.jar.archiveFile)
    inputs.file(provider { mappingsTinyFile() })
    inputs.file(provider { namedGameJarFile() })
    outputs.file outputJar

    doFirst {
        def output = outputJar.get().asFile
        output.parentFile.mkdirs()

        setArgs([
                tasks.jar.archiveFile.get().asFile.absolutePath,
                output.absolutePath,
                mappingsTinyFile().absolutePath,
                'named',
                'official',
                namedGameJarFile().absolutePath
        ] + sourceSets.main.compileClasspath.files.collect { it.absolutePath })
    }
}

