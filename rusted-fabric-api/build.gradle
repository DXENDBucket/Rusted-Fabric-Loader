plugins {
    id 'java-library'
}

group = 'io.github.endx'
// Keep standalone Android and root desktop builds on the same binary API identity.
version = '0.1.0'

tasks.withType(JavaCompile).configureEach {
    options.release = 13
    options.encoding = 'UTF-8'
}

jar {
    archiveBaseName.set('rusted-fabric-api')
}

tasks.register('verifyCommonApiContracts', JavaExec) {
    group = 'verification'
    description = 'Verifies cross-platform context, runtime, event ordering, and listener isolation.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass.set('io.github.endx.rustedfabricapi.common.CommonApiContractVerification')
}

tasks.register('verifyApiContracts', JavaExec) {
    group = 'verification'
    description = 'Runs the complete platform-neutral public API event and context contracts.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass.set('io.github.endx.rustedfabricapi.ApiContractVerification')
}

tasks.register('verifyGameApiContracts', JavaExec) {
    group = 'verification'
    description = 'Verifies stable unit/team views, queries, operations, and typed event adapters.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass.set('io.github.endx.rustedfabricapi.common.GameApiContractVerification')
}

tasks.register('verifyNoPlatformPayload') {
    group = 'verification'
    description = 'Rejects Android, Fabric, desktop backend, and game implementation dependencies.'
    dependsOn jar
    inputs.file(tasks.jar.archiveFile)

    doLast {
        def forbidden = []
        new java.util.zip.ZipFile(tasks.jar.archiveFile.get().asFile).withCloseable { zip ->
            zip.entries().each { entry ->
                def name = entry.name.toLowerCase(Locale.ROOT)
                if (name.endsWith('.apk') || name.endsWith('.dex')
                        || name.startsWith('com/corrodinggames/')
                        || name.startsWith('android/')
                        || name.startsWith('net/fabricmc/')
                        || name.startsWith('org/spongepowered/')
                        || name.startsWith('org/newdawn/slick/')) {
                    forbidden.add(entry.name)
                }
                if (name.endsWith('.class')) {
                    def constants = new String(zip.getInputStream(entry).bytes,
                            java.nio.charset.StandardCharsets.ISO_8859_1)
                    if (constants.contains('Landroid/')
                            || constants.contains('android/content/')
                            || constants.contains('com/corrodinggames/')
                            || constants.contains('net/fabricmc/')
                            || constants.contains('org/spongepowered/')
                            || constants.contains('org/newdawn/slick/')
                            || constants.contains('io/github/libxposed/')) {
                        forbidden.add("${entry.name}: platform/game class reference")
                    }
                }
            }
        }
        if (!forbidden.isEmpty()) {
            throw new GradleException("Common API contains platform/game payloads: ${forbidden}")
        }
    }
}

tasks.register('verifyApiSupportMatrix') {
    group = 'verification'
    description = 'Requires every public event group to have one versioned, machine-readable backend support row.'
    def matrixFile = file('src/main/resources/rustedfabricapi/api-support-matrix.csv')
    def eventDirectory = file('src/main/java/io/github/endx/rustedfabricapi/api/event')
    def capabilitySource = file('src/main/java/io/github/endx/rustedfabricapi/api/RustedFabricCapabilities.java')
    inputs.file(matrixFile)
    inputs.dir(eventDirectory)
    inputs.file(capabilitySource)

    doLast {
        def lines = matrixFile.readLines('UTF-8')
        if (lines.isEmpty() || lines[0] != 'capability,apiClass,windows,androidLocalPatch,androidXposed') {
            throw new GradleException('Unexpected API support matrix schema')
        }
        def capabilities = new LinkedHashSet<String>()
        def matrixClasses = new LinkedHashSet<String>()
        def valid = ['full', 'partial', 'unavailable'] as Set
        lines.drop(1).findAll { !it.trim().isEmpty() && !it.startsWith('#') }.eachWithIndex { row, index ->
            def fields = row.split(',', -1)
            if (fields.length != 5 || !fields[0].matches('[a-z][a-z0-9._-]*\\.v[0-9]+')) {
                throw new GradleException("Malformed API support row ${index + 2}: ${row}")
            }
            if (!capabilities.add(fields[0]) || !matrixClasses.add(fields[1])) {
                throw new GradleException("Duplicate API support row ${index + 2}: ${row}")
            }
            if (fields[2] != 'full' || !valid.contains(fields[3]) || !valid.contains(fields[4])) {
                throw new GradleException("Invalid backend support level at row ${index + 2}: ${row}")
            }
        }
        def eventClasses = fileTree(eventDirectory) {
            include '*.java'
            exclude 'RustedFabricEvent.java'
        }.files.collect { it.name - '.java' } as Set
        if (eventClasses != matrixClasses) {
            throw new GradleException("API support matrix mismatch; missing=${eventClasses - matrixClasses}, stale=${matrixClasses - eventClasses}")
        }
        def constants = capabilitySource.getText('UTF-8')
        capabilities.each { capability ->
            if (!constants.contains('"' + capability + '"')) {
                throw new GradleException("API support capability has no public constant: ${capability}")
            }
        }
    }
}

check.dependsOn tasks.named('verifyCommonApiContracts')
check.dependsOn tasks.named('verifyApiContracts')
check.dependsOn tasks.named('verifyGameApiContracts')
check.dependsOn tasks.named('verifyNoPlatformPayload')
check.dependsOn tasks.named('verifyApiSupportMatrix')
