plugins {
    id 'java'
}

group = 'io.github.endx'
version = rootProject.componentVersions.exampleMod

repositories {
    if (rootProject.hasProperty('offlineRuntimeJars')) {
        flatDir { dirs rootProject.file(rootProject.property('offlineRuntimeJars')) }
    } else {
        mavenCentral()
        maven { url = "https://maven.fabricmc.net/" }
    }
}

def namedGameJarFile = {
    rootProject.hasProperty('namedGameJar')
            ? rootProject.file(rootProject.property('namedGameJar'))
            : rootProject.layout.buildDirectory.file("rusted-dev/game-lib-named.jar").get().asFile
}

def mappingsTinyFile = {
    rootProject.hasProperty('mappingsTiny')
            ? rootProject.file(rootProject.property('mappingsTiny'))
            : rootProject.file("src/main/resources/mappings/mappings.tiny")
}

sourceSets {
    datagen {
        java.srcDir 'src/datagen/java'
    }
}

dependencies {
    compileOnly "net.fabricmc:fabric-loader:0.18.1"
    compileOnly project(":rusted-fabric-api")
    compileOnly files({ namedGameJarFile() })
    datagenImplementation project(":rusted-fabric-api")
}

def generatedDatagenDirectory = layout.buildDirectory.dir('generated/datagen')

tasks.register('runDatagen', JavaExec) {
    group = 'rusted fabric'
    description = 'Generates example Jar resources with the Rusted Fabric datagen API.'
    dependsOn tasks.named('datagenClasses')
    classpath = sourceSets.datagen.runtimeClasspath
    mainClass.set('io.github.endx.rustedfabricexample.ExampleDataGeneration')
    args generatedDatagenDirectory.get().asFile.absolutePath
    outputs.dir generatedDatagenDirectory

    doFirst {
        delete generatedDatagenDirectory
    }
}

sourceSets.main.resources.srcDir(generatedDatagenDirectory)

tasks.withType(JavaCompile).configureEach {
    dependsOn rootProject.tasks.named('generateNamedGameJar')
    options.release = 13
}

tasks.register('verifyPortableExample') {
    group = 'verification'
    description = 'Ensures the portable example listener has no platform or game implementation imports.'
    def source = file('src/main/java/io/github/endx/rustedfabricexample/PortableInitializationProbe.java')
    inputs.file(source)
    doLast {
        def text = source.getText('UTF-8')
        def forbidden = ['net.fabricmc', 'org.spongepowered', 'android.', 'com.corrodinggames',
                         'rustedwarfare.', 'org.newdawn.slick', 'io.github.libxposed']
        def found = forbidden.findAll { text.contains(it) }
        if (!found.isEmpty()) {
            throw new GradleException("Portable example has platform/game dependencies: ${found}")
        }
    }
}

check.dependsOn tasks.named('verifyPortableExample')

processResources {
    dependsOn tasks.named('runDatagen')
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

jar {
    archiveBaseName.set("rusted-fabric-example-mod")
}

tasks.register('remapJarToOfficial', JavaExec) {
    group = 'rusted fabric'
    description = 'Remaps the example mod from named names to official runtime names.'
    dependsOn jar, rootProject.tasks.named('classes'), rootProject.tasks.named('generateNamedGameJar')

    classpath = rootProject.sourceSets.main.runtimeClasspath
    mainClass.set('io.github.endx.rustedfabricloader.tools.RemapJar')

    def outputJar = layout.buildDirectory.file("libs/rusted-fabric-example-mod-${project.version}-official.jar")
    inputs.file(tasks.jar.archiveFile)
    inputs.file(provider { mappingsTinyFile() })
    inputs.file(provider { namedGameJarFile() })
    outputs.file outputJar

    doFirst {
        def output = outputJar.get().asFile
        output.parentFile.mkdirs()

        setArgs([
                tasks.jar.archiveFile.get().asFile.absolutePath,
                output.absolutePath,
                mappingsTinyFile().absolutePath,
                'named',
                'official',
                namedGameJarFile().absolutePath
        ] + sourceSets.main.compileClasspath.files.collect { it.absolutePath })
    }
}
