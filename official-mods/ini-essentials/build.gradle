plugins {
    id 'java'
}

group = 'io.github.endx'
version = rootProject.version

repositories {
    if (rootProject.hasProperty('offlineRuntimeJars')) {
        flatDir { dirs rootProject.file(rootProject.property('offlineRuntimeJars')) }
    } else {
        mavenCentral()
        maven { url = "https://maven.fabricmc.net/" }
    }
}

def namedGameJarFile = {
    rootProject.hasProperty('namedGameJar')
            ? rootProject.file(rootProject.property('namedGameJar'))
            : rootProject.layout.buildDirectory.file("rusted-dev/game-lib-named.jar").get().asFile
}

def mappingsTinyFile = {
    rootProject.hasProperty('mappingsTiny')
            ? rootProject.file(rootProject.property('mappingsTiny'))
            : rootProject.file("src/main/resources/mappings/mappings.tiny")
}

dependencies {
    compileOnly "net.fabricmc:fabric-loader:0.18.1"
    compileOnly project(":rusted-fabric-api")
    compileOnly files({ namedGameJarFile() })
}

tasks.withType(JavaCompile).configureEach {
    dependsOn rootProject.tasks.named('generateNamedGameJar')
    options.release = 13
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

jar {
    archiveBaseName.set("ini-essentials")
}

tasks.register('verifyIniEssentialsMetadata') {
    group = 'verification'
    description = 'Checks the field catalog and synchronized multiplayer declaration.'
    def catalog = file('src/main/resources/ini_essentials/fields.csv')
    def eventDataCatalog = file('src/main/resources/ini_essentials/event-data.csv')
    def syncSchema = file('src/main/resources/ini_essentials/sync-schema.txt')
    def metadata = file('src/main/resources/fabric.mod.json')
    def initializer = file('src/main/java/io/github/endx/iniessentials/IniEssentials.java')
    def cameraFields = file('src/main/java/io/github/endx/iniessentials/CameraActionFields.java')
    inputs.files catalog, eventDataCatalog, syncSchema, metadata, initializer, cameraFields
    doLast {
        def rows = catalog.readLines('UTF-8')
        if (rows.size() < 2 || !rows[0].startsWith('version_added,code,section,')) {
            throw new GradleException('INI Essentials field catalog is empty or malformed')
        }
        def expectedCodes = [
                'allowNegativeHp', 'cameraCenterAt', 'cameraCenterBy',
                'cameraCenterOn', 'cameraTargetZoom', 'cameraStopMovement'
        ] as Set
        def catalogCodes = rows.drop(1).findAll { !it.trim().isEmpty() }.collect {
            it.split(',', 3)[1]
        } as Set
        def cameraSource = cameraFields.getText('UTF-8')
        if (catalogCodes != expectedCodes
                || !expectedCodes.findAll { it.startsWith('camera') }.every {
                    cameraSource.contains('"' + it + '"')
                }) {
            throw new GradleException('INI Essentials camera field catalog/source drifted')
        }
        def eventRows = eventDataCatalog.readLines('UTF-8')
        def expectedEventData = [
                'damage', 'rawDamage', 'hpDamage', 'shieldDamage', 'remainingDamage',
                'hpBefore', 'hpAfter', 'shieldBefore', 'shieldAfter', 'wasLethal'
        ] as Set
        def eventDataNames = eventRows.drop(1).findAll { !it.trim().isEmpty() }.collect {
            it.split(',', 4)[2]
        } as Set
        if (eventRows.isEmpty()
                || !eventRows[0].startsWith('version_added,event,event_data_name,')
                || eventDataNames != expectedEventData
                || !initializer.getText('UTF-8').contains('DamageEventData.enable(')) {
            throw new GradleException('INI Essentials event-data catalog is empty or drifted')
        }
        def mod = new groovy.json.JsonSlurper().parseText(metadata.getText('UTF-8'))
        def multiplayer = mod.custom?.get('rusted_fabric:multiplayer')
        byte[] canonicalSyncSchema = syncSchema.getText('UTF-8')
                .replace('\r\n', '\n').replace('\r', '\n')
                .getBytes(java.nio.charset.StandardCharsets.UTF_8)
        def digest = java.security.MessageDigest.getInstance('SHA-256')
                .digest(canonicalSyncSchema).encodeHex().toString()
        if (mod.id != 'ini_essentials' || multiplayer?.mode != 'optional'
                || multiplayer?.protocol != 'ini_essentials_v3'
                || multiplayer?.syncHash != digest
                || !initializer.getText('UTF-8').contains('"' + digest + '"')) {
            throw new GradleException('INI Essentials multiplayer metadata does not match sync-schema.txt')
        }
    }
}

check.dependsOn tasks.named('verifyIniEssentialsMetadata')

tasks.register('remapJarToOfficial', JavaExec) {
    group = 'rusted fabric'
    description = 'Remaps INI Essentials from named names to official runtime names.'
    dependsOn jar, rootProject.tasks.named('classes'), rootProject.tasks.named('generateNamedGameJar')

    classpath = rootProject.sourceSets.main.runtimeClasspath
    mainClass.set('io.github.endx.rustedfabricloader.tools.RemapJar')

    def outputJar = layout.buildDirectory.file("libs/ini-essentials-${project.version}-official.jar")
    inputs.file(tasks.jar.archiveFile)
    inputs.file(provider { mappingsTinyFile() })
    inputs.file(provider { namedGameJarFile() })
    outputs.file outputJar

    doFirst {
        def output = outputJar.get().asFile
        output.parentFile.mkdirs()
        setArgs([
                tasks.jar.archiveFile.get().asFile.absolutePath,
                output.absolutePath,
                mappingsTinyFile().absolutePath,
                'named',
                'official',
                namedGameJarFile().absolutePath
        ] + sourceSets.main.compileClasspath.files.collect { it.absolutePath })
    }
}
