plugins {
    id 'java'
}

group = 'io.github.endx'
version = rootProject.version

repositories {
    if (rootProject.hasProperty('offlineRuntimeJars')) {
        flatDir { dirs rootProject.file(rootProject.property('offlineRuntimeJars')) }
    } else {
        mavenCentral()
        maven { url = "https://maven.fabricmc.net/" }
    }
}

def namedGameJarFile = {
    rootProject.hasProperty('namedGameJar')
            ? rootProject.file(rootProject.property('namedGameJar'))
            : rootProject.layout.buildDirectory.file("rusted-dev/game-lib-named.jar").get().asFile
}

def mappingsTinyFile = {
    rootProject.hasProperty('mappingsTiny')
            ? rootProject.file(rootProject.property('mappingsTiny'))
            : rootProject.file("src/main/resources/mappings/mappings.tiny")
}

dependencies {
    compileOnly "net.fabricmc:fabric-loader:0.18.1"
    compileOnly project(":rusted-fabric-api")
    compileOnly files({ namedGameJarFile() })
}

tasks.withType(JavaCompile).configureEach {
    dependsOn rootProject.tasks.named('generateNamedGameJar')
    options.release = 13
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

jar {
    archiveBaseName.set("ini-essentials")
}

tasks.register('verifyIniEssentialsMetadata') {
    group = 'verification'
    description = 'Checks the field catalog and synchronized multiplayer declaration.'
    def catalog = file('src/main/resources/ini_essentials/fields.csv')
    def eventDataCatalog = file('src/main/resources/ini_essentials/event-data.csv')
    def syncSchema = file('src/main/resources/ini_essentials/sync-schema.txt')
    def metadata = file('src/main/resources/fabric.mod.json')
    def initializer = file('src/main/java/io/github/endx/iniessentials/IniEssentials.java')
    def cameraFields = file('src/main/java/io/github/endx/iniessentials/CameraActionFields.java')
    def eventRuleFields = file('src/main/java/io/github/endx/iniessentials/EventRuleDefinitions.java')
    def projectileRuleFields = file('src/main/java/io/github/endx/iniessentials/ProjectileRuleDefinitions.java')
    def booleanExpression = file('src/main/java/io/github/endx/iniessentials/BooleanExpression.java')
    def geometryFields = file('src/main/java/io/github/endx/iniessentials/GeometryDefinitions.java')
    def overlayFields = file('src/main/java/io/github/endx/iniessentials/OverlayDefinitions.java')
    def overlayContext = file('src/main/java/io/github/endx/iniessentials/OverlayEvaluationContext.java')
    def fogFields = file('src/main/java/io/github/endx/iniessentials/FogActionFields.java')
    def mathFields = file('src/main/java/io/github/endx/iniessentials/ExtendedMathFunctions.java')
    def referenceGenerator = file('docs/generate_reference.py')
    def referenceWorkbook = file('docs/INI Essentials Unit Modding Reference.xlsx')
    inputs.files catalog, eventDataCatalog, syncSchema, metadata, initializer, cameraFields,
            eventRuleFields,
            projectileRuleFields,
            booleanExpression,
            geometryFields, overlayFields, overlayContext, fogFields, mathFields,
            referenceGenerator, referenceWorkbook
    doLast {
        def rows = catalog.readLines('UTF-8')
        if (rows.size() < 2 || !rows[0].startsWith('version_added,code,section,')) {
            throw new GradleException('INI Essentials field catalog is empty or malformed')
        }
        def expectedCodes = [
                'allowNegativeHp', 'cameraCenterAt', 'cameraCenterBy',
                'cameraCenterOn', 'cameraTargetZoom', 'cameraStopMovement',
                'type', 'radius', 'radiusX', 'radiusY', 'width', 'height',
                'innerRadius', 'startAngle', 'sweepAngle', 'rotation', 'offsetX',
                'offsetY', 'thickness', 'points', 'components', 'operation',
                'geometry', 'team', 'anchor', 'duration', 'follow', 'applyFog',
                'setFogMode', 'pow', 'exp', 'ln', 'log10', 'log', 'cbrt', 'abs',
                'floor', 'ceil', 'round', 'sign', 'clamp', 'lerp',
                'inverse_lerp', 'hypot', 'atan2', 'atan', 'asin', 'acos',
                'tan', 'smoothstep', 'pi', 'tau', 'e',
                'event', 'phase', 'when', 'cancelEventActions',
                'setEventNumber', 'addEventNumber', 'multiplyEventNumber',
                'setEventBoolean', 'cancelEvent', 'setEventValue',
                'addEventValue', 'multiplyEventValue',
                'mutatorNAME_ifCondition', 'mutatorNAME_directDamageMultiplier',
                'mutatorNAME_areaDamageMultiplier',
                'projectileRule_NAME_projectile',
                'projectileRule_NAME_ifCondition',
                'projectileRule_NAME_ifTargetWithTags',
                'projectileRule_NAME_ifTargetWithoutTags',
                'anchor', 'instanceMode', 'indexMode', 'team', 'fogVisibility',
                'isVisible', 'instanceCondition', 'priority', 'slot',
                'maxInstances', 'columns', 'spacingX', 'spacingY', 'alpha',
                'order', 'image', 'imageSmoothing', 'color', 'backgroundColor',
                'borderColor', 'borderWidth', 'value', 'maxValue', 'text',
                'textSize', 'textColor', 'textAlign', 'overlayIndex',
                'overlayStableIndex', 'overlayCount', 'overlayRow',
                'overlayColumn', 'overlaySlot', 'overlayUnitId', 'screenWidth',
                'screenHeight', 'uiScale'
        ] as Set
        def catalogCodes = rows.drop(1).findAll { !it.trim().isEmpty() }.collect {
            it.split(',', 3)[1]
        } as Set
        def cameraSource = cameraFields.getText('UTF-8')
        def geometrySource = geometryFields.getText('UTF-8')
        def overlaySource = overlayFields.getText('UTF-8')
        def overlayContextSource = overlayContext.getText('UTF-8')
        def fogSource = fogFields.getText('UTF-8')
        def mathSource = mathFields.getText('UTF-8')
        def eventRuleSource = file('src/main/java/io/github/endx/iniessentials/EventRuleDefinitions.java').getText('UTF-8')
        def projectileRuleSource = projectileRuleFields.getText('UTF-8')
        def geometryCodes = ['type', 'radius', 'radiusX', 'radiusY', 'width',
                'height', 'innerRadius', 'startAngle', 'sweepAngle', 'rotation',
                'offsetX', 'offsetY', 'thickness', 'points', 'components'] as Set
        def fogCodes = ['operation', 'geometry', 'team', 'anchor', 'duration',
                'follow', 'applyFog', 'setFogMode'] as Set
        def mathCodes = ['pow', 'exp', 'ln', 'log10', 'log', 'cbrt', 'abs', 'floor',
                'ceil', 'round', 'sign', 'clamp', 'lerp', 'inverse_lerp',
                'hypot', 'atan2', 'atan', 'asin', 'acos', 'tan', 'smoothstep',
                'pi', 'tau', 'e'] as Set
        if (catalogCodes != expectedCodes
                || !expectedCodes.findAll { it.startsWith('camera') }.every {
                    cameraSource.contains('"' + it + '"')
                }
                || !cameraSource.contains('NumericExpression.compile(')
                || !cameraSource.contains('BooleanExpression.compile(')
                || !initializer.getText('UTF-8').contains('BooleanExpression.compile(')
                || !fogSource.contains('BooleanExpression.compile(')
                || !geometryCodes.every { geometrySource.contains('"' + it + '"') }
                || !['anchor', 'instanceMode', 'indexMode', 'team', 'fogVisibility',
                    'isVisible', 'instanceCondition', 'priority', 'slot',
                    'maxInstances', 'columns', 'offsetX', 'offsetY', 'spacingX',
                    'spacingY', 'width', 'height', 'alpha', 'order', 'image',
                    'imageSmoothing', 'color', 'backgroundColor', 'borderColor',
                    'borderWidth', 'value', 'maxValue', 'text', 'textSize',
                    'textColor', 'textAlign'].every {
                    overlaySource.contains('"' + it + '"')
                }
                || !['overlayindex', 'overlaystableindex', 'overlaycount',
                    'overlayrow', 'overlaycolumn', 'overlayslot', 'overlayunitid',
                    'screenwidth', 'screenheight', 'uiscale'].every {
                    overlayContextSource.contains('"' + it + '"')
                }
                || !overlaySource.contains('HudRenderEvents.AFTER_HUD')
                || !overlaySource.contains('metadata.loadImageFromConfigWithSmoothing')
                || !fogCodes.every { fogSource.contains('"' + it + '"') }
                || !['event', 'phase', 'when', 'cancelEventActions',
                    'setEventNumber', 'addEventNumber', 'multiplyEventNumber',
                    'setEventBoolean', 'cancelEvent', 'setEventValue',
                    'addEventValue', 'multiplyEventValue'].every {
                    eventRuleSource.contains('"' + it + '"')
                }
                || !eventRuleSource.contains('CustomUnitTriggerEvents.PREPARE_QUEUE')
                || !eventRuleSource.contains('CustomUnitOperationEvents.BEFORE_EVENT')
                || !eventRuleSource.contains('CustomUnitEventEvaluation.withContext')
                || !eventRuleSource.contains('NumericExpression.compile(')
                || !eventRuleSource.contains('BooleanExpression.compile(')
                || !['mutator_if_condition', 'mutator_dynamic_direct_multiplier',
                    'mutator_dynamic_area_multiplier', 'projectileRule_'].every {
                    projectileRuleSource.contains(it)
                }
                || !projectileRuleSource.contains('ProjectileCombatEvents.MODIFY_DAMAGE')
                || !projectileRuleSource.contains('ProjectileCombatEvents.SELECT_TURRET_PROJECTILE')
                || !projectileRuleSource.contains('CustomUnitEventEvaluation.withContext')
                || !mathCodes.every { mathSource.contains('"' + it + '"') }) {
            throw new GradleException('INI Essentials field catalog/source drifted')
        }
        def eventRows = eventDataCatalog.readLines('UTF-8')
        def expectedEventData = [
                'damage', 'rawDamage', 'hpDamage', 'shieldDamage', 'remainingDamage',
                'hpBefore', 'hpAfter', 'shieldBefore', 'shieldAfter', 'wasLethal',
                'actionId', 'queueQuantity', 'producesUnit', 'producedUnitType',
                'queueSizeBefore', 'queueSizeAfter', 'hasActionTargetPoint',
                'actionTargetX', 'actionTargetY', 'actionTargetUnit',
                'orderType', 'waypointTargetX', 'waypointTargetY', 'waypointTargetUnit',
                'waypointQueuedByPlayer', 'waypointBuildUnitType', 'waypointActionId',
                'oldTeamId', 'newTeamId', 'oldAllianceGroup', 'newAllianceGroup',
                'teleportFromX', 'teleportFromY', 'teleportFromHeight',
                'teleportFromDirection', 'teleportToX', 'teleportToY',
                'teleportToHeight', 'teleportToDirection', 'removedUnit',
                'attachmentSlot', 'attachmentSlotIndex', 'attachmentWasTransported',
                'killedUnit', 'killedUnitType', 'killedUnitTeamId', 'killedUnitX',
                'killedUnitY', 'killedUnitHp', 'killedUnitMaxHp',
                'killedUnitWasBuilding', 'finishedUnit', 'finishedUnitType',
                'finishedUnitTeamId', 'finishedUnitX', 'finishedUnitY',
                'finishedActionId', 'finishedQueueQuantity', 'touchedUnit',
                'touchedUnitType', 'touchedUnitTeamId', 'touchedUnitX',
                'touchedUnitY', 'transportedUnit', 'transportedUnitType',
                'transportedUnitTeamId', 'transportedUnitX', 'transportedUnitY',
                'transportUsedSlots', 'transportMaxSlots', 'transportUnit',
                'transportUnitType', 'transportUnitTeamId', 'transportUnitX',
                'transportUnitY', 'carrierUsedSlots', 'carrierMaxSlots',
                'messageSender', 'messageSenderUnitType', 'messageSenderTeamId',
                'messageSenderX', 'messageSenderY', 'messageHasTags', 'messageHasData'
        ] as Set
        def expectedEventTypes = [
                'tookDamage', 'queueItemAdded', 'queueItemCancelled',
                'newWaypointGivenByPlayer', 'teamChanged', 'teleported',
                'attachmentRemoved', 'killedAnyUnit', 'queuedUnitFinished',
                'touchTargetSuccess', 'transportingNewUnit',
                'transportUnloadedOrRemovedUnit', 'enteredTransport',
                'leftTransport', 'newMessage'
        ] as Set
        def eventDataNames = eventRows.drop(1).findAll { !it.trim().isEmpty() }.collect {
            it.split(',', 4)[2]
        } as Set
        def eventTypes = eventRows.drop(1).findAll { !it.trim().isEmpty() }.collect {
            it.split(',', 3)[1]
        } as Set
        if (eventRows.isEmpty()
                || !eventRows[0].startsWith('version_added,event,event_data_name,')
                || eventDataNames != expectedEventData
                || eventTypes != expectedEventTypes
                || !initializer.getText('UTF-8').contains('DamageEventData.enable(')
                || !initializer.getText('UTF-8').contains('NativeEventData.enable(')) {
            throw new GradleException('INI Essentials event-data catalog is empty or drifted')
        }
        def generatorSource = referenceGenerator.getText('UTF-8')
        if (!generatorSource.contains('"core": ("0F9D58", "0D904F")')
                || !generatorSource.contains('"action": ("FF9900", "B45F06")')
                || !generatorSource.contains('"event": ("00A6B8", "007C91")')
                || !generatorSource.contains('"geometry": ("5E35B1", "311B92")')
                || !generatorSource.contains('"overlay": ("AD1457", "6A1B4D")')
                  || !generatorSource.contains('EVENT_INDEX_COLOR = "B2EBF2"')
                  || !generatorSource.contains('SHORTCUT_COLUMNS = 4')
                  || !generatorSource.contains('def inject_navigation_shapes(')
                || !generatorSource.contains('hlinkClick')
                || !generatorSource.contains('"--check"')) {
            throw new GradleException('INI Essentials reference generator lost section styling/navigation')
        }
        new java.util.zip.ZipFile(referenceWorkbook).withCloseable { zip ->
            def workbookXml = zip.getInputStream(zip.getEntry('xl/workbook.xml')).getText('UTF-8')
            def stylesXml = zip.getInputStream(zip.getEntry('xl/styles.xml')).getText('UTF-8')
            def sheetsXml = new StringBuilder()
            def drawingsXml = new StringBuilder()
            def drawingRelationshipsXml = new StringBuilder()
            zip.entries().each { entry ->
                if (entry.name.startsWith('xl/worksheets/sheet') && entry.name.endsWith('.xml')) {
                    sheetsXml.append(zip.getInputStream(entry).getText('UTF-8'))
                } else if (entry.name.startsWith('xl/drawings/drawing')
                        && entry.name.endsWith('.xml')) {
                    drawingsXml.append(zip.getInputStream(entry).getText('UTF-8'))
                } else if (entry.name.startsWith('xl/drawings/_rels/drawing')
                        && entry.name.endsWith('.xml.rels')) {
                    drawingRelationshipsXml.append(
                            zip.getInputStream(entry).getText('UTF-8'))
                }
            }
            def sheetText = sheetsXml.toString()
            def drawingText = drawingsXml.toString()
            def drawingRelationshipText = drawingRelationshipsXml.toString()
            def hyperlinkCount = (drawingText =~ /hlinkClick/).count
            if (!workbookXml.contains('name="English"')
                    || !workbookXml.contains('name="简体中文"')
                    || !['FF0F9D58', 'FF0D904F', 'FFFF9900', 'FFB45F06',
                          'FF5E35B1', 'FF311B92', 'FFAD1457', 'FF6A1B4D'].every {
                        stylesXml.contains(it)
                    }
                    || hyperlinkCount < 72
                    || !drawingRelationshipText.contains('/relationships/hyperlink')
                    || !['#rf_en_core', '#rf_en_action', '#rf_zh_core',
                         '#rf_zh_action', '#rf_en_shortcuts', '#rf_zh_shortcuts',
                         '#rf_en_event_data', '#rf_zh_event_data',
                         '#rf_en_event_tookdamage', '#rf_zh_event_attachmentremoved',
                         '#rf_en_event_killedanyunit', '#rf_zh_event_newmessage'].every {
                        drawingRelationshipText.contains(it)
                    }
                    || !sheetText.contains('Section shortcuts')
                    || !sheetText.contains('节快捷导航')
                    || !(expectedCodes + expectedEventData).every { sheetText.contains(it) }) {
                throw new GradleException(
                        'Generated INI Essentials workbook is stale or lost drawing links/colors')
            }
        }
        def mod = new groovy.json.JsonSlurper().parseText(metadata.getText('UTF-8'))
        def multiplayer = mod.custom?.get('rusted_fabric:multiplayer')
        byte[] canonicalSyncSchema = syncSchema.getText('UTF-8')
                .replace('\r\n', '\n').replace('\r', '\n')
                .getBytes(java.nio.charset.StandardCharsets.UTF_8)
        def digest = java.security.MessageDigest.getInstance('SHA-256')
                .digest(canonicalSyncSchema).encodeHex().toString()
        if (mod.id != 'ini_essentials' || multiplayer?.mode != 'optional'
                || multiplayer?.protocol != 'ini_essentials_v12'
                || multiplayer?.syncHash != digest
                || !initializer.getText('UTF-8').contains('"' + digest + '"')) {
            throw new GradleException('INI Essentials multiplayer metadata does not match sync-schema.txt')
        }
    }
}

check.dependsOn tasks.named('verifyIniEssentialsMetadata')

tasks.register('remapJarToOfficial', JavaExec) {
    group = 'rusted fabric'
    description = 'Remaps INI Essentials from named names to official runtime names.'
    dependsOn jar, rootProject.tasks.named('classes'), rootProject.tasks.named('generateNamedGameJar')

    classpath = rootProject.sourceSets.main.runtimeClasspath
    mainClass.set('io.github.endx.rustedfabricloader.tools.RemapJar')

    def outputJar = layout.buildDirectory.file("libs/ini-essentials-${project.version}-official.jar")
    inputs.file(tasks.jar.archiveFile)
    inputs.file(provider { mappingsTinyFile() })
    inputs.file(provider { namedGameJarFile() })
    outputs.file outputJar

    doFirst {
        def output = outputJar.get().asFile
        output.parentFile.mkdirs()
        setArgs([
                tasks.jar.archiveFile.get().asFile.absolutePath,
                output.absolutePath,
                mappingsTinyFile().absolutePath,
                'named',
                'official',
                namedGameJarFile().absolutePath
        ] + sourceSets.main.compileClasspath.files.collect { it.absolutePath })
    }
}
