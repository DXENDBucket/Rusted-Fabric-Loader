plugins {
    id 'java'
}

group = 'io.github.endx'
version = rootProject.componentVersions.iniEssentials

repositories {
    if (rootProject.hasProperty('offlineRuntimeJars')) {
        flatDir { dirs rootProject.file(rootProject.property('offlineRuntimeJars')) }
    } else {
        mavenCentral()
        maven { url = "https://maven.fabricmc.net/" }
    }
}

def namedGameJarFile = {
    rootProject.hasProperty('namedGameJar')
            ? rootProject.file(rootProject.property('namedGameJar'))
            : rootProject.layout.buildDirectory.file("rusted-dev/game-lib-named.jar").get().asFile
}

def mappingsTinyFile = {
    rootProject.hasProperty('mappingsTiny')
            ? rootProject.file(rootProject.property('mappingsTiny'))
            : rootProject.file("src/main/resources/mappings/mappings.tiny")
}

dependencies {
    compileOnly "net.fabricmc:fabric-loader:0.18.1"
    compileOnly project(":rusted-fabric-api")
    compileOnly files({ namedGameJarFile() })
}

tasks.withType(JavaCompile).configureEach {
    dependsOn rootProject.tasks.named('generateNamedGameJar')
    options.release = 13
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

jar {
    archiveBaseName.set("ini-essentials")
}

tasks.register('verifyIniEssentialsMetadata') {
    group = 'verification'
    description = 'Checks the field catalog and synchronized multiplayer declaration.'
    def catalog = file('src/main/resources/ini_essentials/fields.csv')
    def eventDataCatalog = file('src/main/resources/ini_essentials/event-data.csv')
    def syncSchema = file('src/main/resources/ini_essentials/sync-schema.txt')
    def metadata = file('src/main/resources/fabric.mod.json')
    def initializer = file('src/main/java/io/github/endx/iniessentials/IniEssentials.java')
    def cameraFields = file('src/main/java/io/github/endx/iniessentials/action/CameraActionFields.java')
    def autoTriggerCooldownFields = file('src/main/java/io/github/endx/iniessentials/action/PerActionAutoTriggerCooldownFields.java')
    def movementActionFields = file('src/main/java/io/github/endx/iniessentials/action/MovementActionFields.java')
    def actionPositionReference = file('src/main/java/io/github/endx/iniessentials/ActionPositionReference.java')
    def eventRuleFields = file('src/main/java/io/github/endx/iniessentials/event/EventRuleDefinitions.java')
    def projectileRuleFields = file('src/main/java/io/github/endx/iniessentials/projectile/ProjectileRuleDefinitions.java')
    def customProjectileDefinitions = file('src/main/java/io/github/endx/iniessentials/projectile/CustomProjectileDefinitions.java')
    def customProjectileActionFields = file('src/main/java/io/github/endx/iniessentials/projectile/CustomProjectileActionFields.java')
    def customProjectileEmitter = file('src/main/java/io/github/endx/iniessentials/projectile/CustomProjectileEmitter.java')
    def customProjectileSpawnRequest = file('src/main/java/io/github/endx/iniessentials/projectile/CustomProjectileSpawnRequest.java')
    def customProjectileRuntime = file('src/main/java/io/github/endx/iniessentials/projectile/CustomProjectileRuntime.java')
    def customProjectileExpression = file('src/main/java/io/github/endx/iniessentials/projectile/CustomProjectileExpression.java')
    def customProjectileTurretFields = file('src/main/java/io/github/endx/iniessentials/projectile/CustomProjectileTurretFields.java')
    def customProjectileDecalRenderer = file('src/main/java/io/github/endx/iniessentials/projectile/CustomProjectileDecalRenderer.java')
    def booleanExpression = file('src/main/java/io/github/endx/iniessentials/BooleanExpression.java')
    def geometryFields = file('src/main/java/io/github/endx/iniessentials/GeometryDefinitions.java')
    def decalMaskFields = file('src/main/java/io/github/endx/iniessentials/decal/DecalMaskDefinitions.java')
    def overlayFields = file('src/main/java/io/github/endx/iniessentials/overlay/OverlayDefinitions.java')
    def overlayContext = file('src/main/java/io/github/endx/iniessentials/overlay/OverlayEvaluationContext.java')
    def fogFields = file('src/main/java/io/github/endx/iniessentials/action/FogActionFields.java')
    def mathFields = file('src/main/java/io/github/endx/iniessentials/ExtendedMathFunctions.java')
    def unitContextProperties = file('src/main/java/io/github/endx/iniessentials/UnitContextProperties.java')
    def referenceGenerator = file('docs/generate_reference.py')
    def referenceWorkbook = file('docs/INI Essentials Unit Modding Reference.xlsx')
    inputs.files catalog, eventDataCatalog, syncSchema, metadata, initializer, cameraFields,
            autoTriggerCooldownFields, movementActionFields,
            actionPositionReference,
            eventRuleFields,
            projectileRuleFields,
            customProjectileDefinitions, customProjectileActionFields,
            customProjectileEmitter, customProjectileSpawnRequest, customProjectileRuntime,
            customProjectileExpression,
            customProjectileTurretFields, customProjectileDecalRenderer,
            booleanExpression,
            geometryFields, decalMaskFields, overlayFields, overlayContext, fogFields, mathFields,
            unitContextProperties, referenceGenerator, referenceWorkbook
    doLast {
        def rows = catalog.readLines('UTF-8')
        if (rows.size() < 2 || !rows[0].startsWith('version_added,code,section,')) {
            throw new GradleException('INI Essentials field catalog is empty or malformed')
        }
        def expectedCodes = [
                'allowNegativeHp', 'autoTriggerCooldownTime',
                'autoTriggerCooldownTime_allowDangerousHighCPU',
                'setUnitMovementType',
                'cameraCenterAt', 'cameraCenterBy',
                'cameraCenterOn', 'cameraTargetZoom', 'cameraStopMovement',
                'type', 'radius', 'radiusX', 'radiusY', 'width', 'height',
                'innerRadius', 'startAngle', 'sweepAngle', 'rotation', 'offsetX',
                'offsetY', 'thickness', 'points', 'components', 'operation',
                'geometry', 'team', 'anchor', 'duration', 'follow', 'applyFog',
                'setFogMode', 'pow', 'exp', 'ln', 'log10', 'log', 'cbrt', 'abs',
                'floor', 'ceil', 'round', 'sign', 'clamp', 'lerp',
                'inverse_lerp', 'hypot', 'atan2', 'atan', 'asin', 'acos',
                'tan', 'smoothstep', 'pi', 'tau', 'e',
                'event', 'phase', 'when', 'cancelEventActions',
                'setEventNumber', 'addEventNumber', 'multiplyEventNumber',
                'setEventBoolean', 'cancelEvent', 'setEventValue',
                'addEventValue', 'multiplyEventValue',
                'mutatorNAME_ifCondition', 'mutatorNAME_directDamageMultiplier',
                'mutatorNAME_areaDamageMultiplier',
                'projectileRule_NAME_projectile',
                'projectileRule_NAME_ifCondition',
                'projectileRule_NAME_ifTargetWithTags',
                'projectileRule_NAME_ifTargetWithoutTags',
                'layer', 'anchor', 'instanceMode', 'indexMode', 'team', 'fogVisibility',
                'onlyWhileAlive', 'isVisible', 'instanceCondition', 'priority', 'slot',
                'maxInstances', 'columns', 'xOffsetAbsolute', 'yOffsetAbsolute',
                'spacingX', 'spacingY', 'dirOffset', 'alpha',
                'order', 'image', 'imageSmoothing', 'color', 'backgroundColor',
                'borderColor', 'borderWidth', 'value', 'maxValue', 'text',
                'textSize', 'textColor', 'textAlign', 'scale', 'scaleX', 'scaleY',
                'frame', 'total_frames', 'frame_width', 'frame_height',
                'frame_verticalOrdering', 'barDirection', 'overlayIndex',
                'mask', 'maskGeometry', 'maskRender', 'maskAlphaThreshold',
                'maskInvert', 'maskThresholdMode', 'maskAlphaMode',
                'maskUsesSourceAlpha', 'barValue', 'barMaxValue', 'barColor',
                'barBackgroundColor', 'barBorderColor', 'barBorderWidth',
                'barDirection',
                'overlayStableIndex', 'overlayCount', 'overlayRow',
                'overlayColumn', 'overlaySlot', 'overlayUnitId', 'screenWidth',
                'screenHeight', 'uiScale',
                'self.activeWaypointType', 'self.activeWaypointX',
                'self.activeWaypointY', 'self.activeWaypointRelativeX',
                'self.activeWaypointRelativeY', 'self.isSelectedByLocalPlayer',
                'class', 'name', 'schemaVersion', 'aimMode', 'count',
                'centerDirection', 'originSpacing', 'lineAngleOffset',
                'originOffsetX', 'originOffsetY', 'originOffsetHeight',
                'directionDistance', 'spawnCustomProjectile',
                '@memory NAME', 'speed', 'turnSpeed', 'dx', 'dy',
                'onCreate', 'onUpdate', 'onImpact', 'onRemove', 'ifCondition',
                'setMemory', 'setSpeed', 'setTurnSpeed', 'setDx', 'setDy',
                'setOffsetX', 'setOffsetY', 'projectile.age',
                'projectile.x|y|height', 'projectile.direction|speed|dx|dy',
                'projectile.offsetX|offsetY', 'projectilePattern',
                'collideWithUnits', 'collideWithTerrain', 'contactCollisionRadius',
                'terrainTransitionFrom', 'terrainTransitionTo',
                'unitCollisionLayers', 'unitCollisionMovementTypes',
                'unitCollisionMinHeight', 'unitCollisionMaxHeight',
                'unitCollisionWithTags', 'unitCollisionWithoutTags',
                'unitCollisionIncludeTransported',
                'effect_*', 'decal_*',
                'projectilePatternRule_NAME_pattern',
                'projectilePatternRule_NAME_ifCondition',
                'projectilePatternRule_NAME_ifTargetWithTags',
                'projectilePatternRule_NAME_ifTargetWithoutTags'
        ] as Set
        def catalogCodes = rows.drop(1).findAll { !it.trim().isEmpty() }.collect {
            it.split(',', 3)[1]
        } as Set
        def cameraSource = cameraFields.getText('UTF-8')
        def autoTriggerCooldownSource = autoTriggerCooldownFields.getText('UTF-8')
        def movementActionSource = movementActionFields.getText('UTF-8')
        def actionPositionSource = actionPositionReference.getText('UTF-8')
        def geometrySource = geometryFields.getText('UTF-8')
        def decalMaskSource = decalMaskFields.getText('UTF-8')
        def overlaySource = overlayFields.getText('UTF-8')
        def overlayContextSource = overlayContext.getText('UTF-8')
        def fogSource = fogFields.getText('UTF-8')
        def mathSource = mathFields.getText('UTF-8')
        def unitContextSource = unitContextProperties.getText('UTF-8')
        def eventRuleSource = eventRuleFields.getText('UTF-8')
        def projectileRuleSource = projectileRuleFields.getText('UTF-8')
        def customProjectileSource = customProjectileDefinitions.getText('UTF-8')
        def customProjectileActionSource = customProjectileActionFields.getText('UTF-8')
        def customProjectileEmitterSource = customProjectileEmitter.getText('UTF-8')
        def customProjectileSpawnRequestSource = customProjectileSpawnRequest.getText('UTF-8')
        def customProjectileRuntimeSource = customProjectileRuntime.getText('UTF-8')
        def customProjectileExpressionSource = customProjectileExpression.getText('UTF-8')
        def customProjectileTurretSource = customProjectileTurretFields.getText('UTF-8')
        def customProjectileDecalSource = customProjectileDecalRenderer.getText('UTF-8')
        def initializerSource = initializer.getText('UTF-8')
        def geometryCodes = ['type', 'radius', 'radiusX', 'radiusY', 'width',
                'height', 'innerRadius', 'startAngle', 'sweepAngle', 'rotation',
                'offsetX', 'offsetY', 'thickness', 'points', 'components'] as Set
        def fogCodes = ['operation', 'geometry', 'team', 'anchor', 'duration',
                'follow', 'applyFog', 'setFogMode'] as Set
        def mathCodes = ['pow', 'exp', 'ln', 'log10', 'log', 'cbrt', 'abs', 'floor',
                'ceil', 'round', 'sign', 'clamp', 'lerp', 'inverse_lerp',
                'hypot', 'atan2', 'atan', 'asin', 'acos', 'tan', 'smoothstep',
                'pi', 'tau', 'e'] as Set
        if (catalogCodes != expectedCodes
                || !['"autoTriggerCooldownTime"',
                    '"autoTriggerCooldownTime_allowDangerousHighCPU"'].every {
                    autoTriggerCooldownSource.contains(it)
                }
                || !autoTriggerCooldownSource.contains('PerActionAutoTriggerCooldowns.configureSeconds(')
                || !expectedCodes.findAll { it.startsWith('camera') }.every {
                    cameraSource.contains('"' + it + '"')
                }
                || !cameraSource.contains('NumericExpression.compile(')
                || !cameraSource.contains('BooleanExpression.compile(')
                || !cameraSource.contains('ActionPositionReference.compile(')
                || !fogSource.contains('ActionPositionReference.compile(')
                || !actionPositionSource.contains('UnitReferenceExpression.compile(')
                || !actionPositionSource.contains('ACTION_TARGET')
                || !initializerSource.contains('BooleanExpression.compile(')
                || !initializerSource.contains('IniApplicationPhase.AFTER_METADATA_PARSED')
                || !initializerSource.contains('CustomUnitRegistryEvents.BEFORE_NATIVE_LOAD.register(')
                || !initializerSource.contains('ExtendedMathFunctions.register();')
                || !initializerSource.contains('OverlayEvaluationContext.registerFunctions();')
                || overlaySource.contains('OverlayEvaluationContext.registerFunctions();')
                || !fogSource.contains('BooleanExpression.compile(')
                || !fogSource.contains('IniApplicationPhase.AFTER_METADATA_PARSED')
                || !fogSource.contains('validateReferences(metadata)')
                || !geometryCodes.every { geometrySource.contains('"' + it + '"') }
                || !geometrySource.contains('IniApplicationPhase.AFTER_METADATA_PARSED')
                || !['layer', 'anchor', 'instanceMode', 'indexMode', 'team', 'fogVisibility',
                    'isVisible', 'instanceCondition', 'priority', 'slot',
                    'maxInstances', 'columns', 'xOffsetAbsolute', 'yOffsetAbsolute', 'spacingX',
                    'spacingY', 'width', 'height', 'alpha', 'order', 'image',
                    'imageSmoothing', 'color', 'backgroundColor', 'borderColor',
                    'borderWidth', 'value', 'maxValue', 'text', 'textSize',
                    'textColor', 'textAlign', 'scale', 'scaleX', 'scaleY',
                    'dirOffset', 'onlyWhileAlive', 'frame', 'total_frames', 'frame_width',
                    'frame_height', 'frame_verticalOrdering', 'barDirection',
                    'mask', 'maskGeometry', 'maskRender', 'maskAlphaThreshold',
                    'maskInvert', 'maskThresholdMode', 'maskAlphaMode',
                    'maskUsesSourceAlpha'].every {
                    overlaySource.contains('"' + it + '"')
                }
                || !['overlayindex', 'overlaystableindex', 'overlaycount',
                    'overlayrow', 'overlaycolumn', 'overlayslot', 'overlayunitid',
                    'screenwidth', 'screenheight', 'uiscale'].every {
                    overlayContextSource.contains('"' + it + '"')
                }
                || !['self.activeWaypointType', 'self.activeWaypointX',
                    'self.activeWaypointY', 'self.activeWaypointRelativeX',
                    'self.activeWaypointRelativeY',
                    'self.isSelectedByLocalPlayer'].every {
                    unitContextSource.contains('"' + it + '"')
                }
                || !overlaySource.contains('HudRenderEvents.BEFORE_HUD')
                || !overlaySource.contains('HudRenderEvents.AFTER_HUD')
                || !overlaySource.contains('IniApplicationPhase.AFTER_METADATA_PARSED')
                || !overlaySource.contains('NEAREST_TO_CAMERA')
                || !overlaySource.contains('FARTHEST_FROM_CAMERA')
                || !overlaySource.contains('FrameLayout')
                || !overlaySource.contains('"overlay_image_definition"')
                || !overlaySource.contains('Units.snapshot()')
                || !overlaySource.contains('AlphaMasks.imageAffine')
                || !overlaySource.contains('metadata.loadImageFromConfigWithSmoothing')
                || !['mask', 'maskGeometry', 'maskRender', 'maskAlphaThreshold',
                    'maskInvert', 'maskThresholdMode', 'maskAlphaMode',
                    'maskUsesSourceAlpha', 'barValue', 'barMaxValue', 'barColor',
                    'barBackgroundColor', 'barBorderColor', 'barBorderWidth',
                    'barDirection'].every { decalMaskSource.contains('"' + it + '"') }
                || !decalMaskSource.contains('DecalRenderEvents.BEFORE_LAYER')
                || !decalMaskSource.contains('IniApplicationPhase.AFTER_METADATA_PARSED')
                || !decalMaskSource.contains('ClientImages.createBar')
                || !decalMaskSource.contains('AlphaMasks.imageAffine')
                || !decalMaskSource.contains('GeometryDefinitions.require(')
                || !fogCodes.every { fogSource.contains('"' + it + '"') }
                || !['event', 'phase', 'when', 'cancelEventActions',
                    'setEventNumber', 'addEventNumber', 'multiplyEventNumber',
                    'setEventBoolean', 'cancelEvent', 'setEventValue',
                    'addEventValue', 'multiplyEventValue'].every {
                    eventRuleSource.contains('"' + it + '"')
                }
                || !eventRuleSource.contains('CustomUnitTriggerEvents.PREPARE_QUEUE')
                || !eventRuleSource.contains('CustomUnitOperationEvents.BEFORE_EVENT')
                || !eventRuleSource.contains('CustomUnitEventEvaluation.withContext')
                || !eventRuleSource.contains('IniApplicationPhase.AFTER_METADATA_PARSED')
                || !eventRuleSource.contains('NumericExpression.compile(')
                || !eventRuleSource.contains('BooleanExpression.compile(')
                || !['mutator_if_condition', 'mutator_dynamic_direct_multiplier',
                    'mutator_dynamic_area_multiplier', 'projectileRule_'].every {
                    projectileRuleSource.contains(it)
                }
                || !projectileRuleSource.contains('ProjectileCombatEvents.MODIFY_DAMAGE')
                || !projectileRuleSource.contains('ProjectileCombatEvents.SELECT_TURRET_PROJECTILE')
                || !projectileRuleSource.contains('CustomUnitEventEvaluation.withContext')
                || !projectileRuleSource.contains('conditionSource')
                || !projectileRuleSource.contains('directMultiplierSource')
                || !['class', 'schemaVersion', 'projectile', 'pattern_',
                    'spawnProjectilesOnCreate', 'spawnProjectilesOnExplode',
                    'spawnProjectilesOnEndOfLife'].every {
                    customProjectileSource.contains('"' + it + '"')
                }
                || !customProjectileSource.contains('CustomProjectileTemplate.parseFromConfig')
                || !customProjectileSource.contains('CustomProjectileAssets.parseEffects')
                || !customProjectileSource.contains('CustomProjectileAssets.parseDecals')
                || !['collideWithUnits', 'collideWithTerrain', 'contactCollisionRadius',
                    'terrainTransitionFrom', 'terrainTransitionTo',
                    'unitCollisionLayers', 'unitCollisionMovementTypes',
                    'unitCollisionMinHeight', 'unitCollisionMaxHeight',
                    'unitCollisionWithTags', 'unitCollisionWithoutTags',
                    'unitCollisionIncludeTransported'].every {
                    customProjectileSource.contains('"' + it + '"') }
                || !customProjectileSource.contains('NumericExpression.compile(')
                || !customProjectileSource.contains(
                    'ConfigVariableProcessor.processStaticConfigVariables(metadata, config)')
                || !customProjectileActionSource.contains('"spawnCustomProjectile"')
                || customProjectileActionSource.contains('"emitProjectilePattern"')
                || !['"aimMode"', '"count"', '"centerDirection"', '"startAngle"',
                    '"sweepAngle"', '"originSpacing"', '"lineAngleOffset"',
                    '"originOffsetX"', '"originOffsetY"', '"originOffsetHeight"',
                    '"directionDistance"', '"speed"', '"turnSpeed"', '"dx"',
                    '"dy"', '"offsetX"', '"offsetY"'].every {
                    customProjectileSpawnRequestSource.contains(it)
                }
                || customProjectileRuntimeSource.contains('"emitProjectilePattern"')
                || !customProjectileEmitterSource.contains('ProjectilePatternEmitter.emit(')
                || !['"speed"', '"turnSpeed"', '"dx"', '"dy"', '"offsetX"',
                    '"offsetY"', '"onCreate"', '"onUpdate"', '"onImpact"',
                    '"onRemove"', '"setMemory"', '"setSpeed"', '"setTurnSpeed"',
                    '"setDx"', '"setDy"', '"setOffsetX"', '"setOffsetY"'].every {
                    customProjectileRuntimeSource.contains(it)
                }
                || !customProjectileRuntimeSource.contains('ProjectileEvents.AFTER_UPDATE')
                || !customProjectileExpressionSource.contains('LOCAL_MEMORY')
                || !customProjectileTurretSource.contains('"projectilePattern"')
                || !customProjectileTurretSource.contains('TurretProjectilePatternEvents.PLAN')
                || !customProjectileTurretSource.contains('TurretProjectilePatternPlan')
                || !customProjectileTurretSource.contains('projectilePatternRule_')
                || !customProjectileTurretSource.contains('conditionSource')
                || !customProjectileTurretSource.contains('DeferredReference')
                || !customProjectileTurretSource.contains('resolveStaticValues')
                || !customProjectileTurretSource.contains('iniEssentialsPatternPlaceholder')
                || !movementActionSource.contains('UnitMovementOverrides.set(')
                || !movementActionSource.contains('StringExpression.compile(')
                || !customProjectileDecalSource.contains('ProjectileRenderEvents.DRAW')
                || !mathCodes.every { mathSource.contains('"' + it + '"') }) {
            throw new GradleException('INI Essentials field catalog/source drifted')
        }
        def eventRows = eventDataCatalog.readLines('UTF-8')
        def expectedEventData = [
                'damage', 'rawDamage', 'hpDamage', 'shieldDamage', 'remainingDamage',
                'hpBefore', 'hpAfter', 'shieldBefore', 'shieldAfter', 'wasLethal',
                'actionId', 'queueQuantity', 'producesUnit', 'producedUnitType',
                'queueSizeBefore', 'queueSizeAfter', 'hasActionTargetPoint',
                'actionTargetX', 'actionTargetY', 'actionTargetUnit',
                'orderType', 'waypointTargetX', 'waypointTargetY', 'waypointTargetUnit',
                'waypointQueuedByPlayer', 'waypointBuildUnitType', 'waypointActionId',
                'oldTeamId', 'newTeamId', 'oldAllianceGroup', 'newAllianceGroup',
                'teleportFromX', 'teleportFromY', 'teleportFromHeight',
                'teleportFromDirection', 'teleportToX', 'teleportToY',
                'teleportToHeight', 'teleportToDirection', 'removedUnit',
                'attachmentSlot', 'attachmentSlotIndex', 'attachmentWasTransported',
                'killedUnit', 'killedUnitType', 'killedUnitTeamId', 'killedUnitX',
                'killedUnitY', 'killedUnitHp', 'killedUnitMaxHp',
                'killedUnitWasBuilding', 'finishedUnit', 'finishedUnitType',
                'finishedUnitTeamId', 'finishedUnitX', 'finishedUnitY',
                'finishedActionId', 'finishedQueueQuantity', 'touchedUnit',
                'touchedUnitType', 'touchedUnitTeamId', 'touchedUnitX',
                'touchedUnitY', 'transportedUnit', 'transportedUnitType',
                'transportedUnitTeamId', 'transportedUnitX', 'transportedUnitY',
                'transportUsedSlots', 'transportMaxSlots', 'transportUnit',
                'transportUnitType', 'transportUnitTeamId', 'transportUnitX',
                'transportUnitY', 'carrierUsedSlots', 'carrierMaxSlots',
                'messageSender', 'messageSenderUnitType', 'messageSenderTeamId',
                'messageSenderX', 'messageSenderY', 'messageHasTags', 'messageHasData'
        ] as Set
        def expectedEventTypes = [
                'tookDamage', 'queueItemAdded', 'queueItemCancelled',
                'newWaypointGivenByPlayer', 'teamChanged', 'teleported',
                'attachmentRemoved', 'killedAnyUnit', 'queuedUnitFinished',
                'touchTargetSuccess', 'transportingNewUnit',
                'transportUnloadedOrRemovedUnit', 'enteredTransport',
                'leftTransport', 'newMessage'
        ] as Set
        def eventDataNames = eventRows.drop(1).findAll { !it.trim().isEmpty() }.collect {
            it.split(',', 4)[2]
        } as Set
        def eventTypes = eventRows.drop(1).findAll { !it.trim().isEmpty() }.collect {
            it.split(',', 3)[1]
        } as Set
        if (eventRows.isEmpty()
                || !eventRows[0].startsWith('version_added,event,event_data_name,')
                || eventDataNames != expectedEventData
                || eventTypes != expectedEventTypes
                || !initializerSource.contains('DamageEventData.enable(')
                || !initializerSource.contains('NativeEventData.enable(')) {
            throw new GradleException('INI Essentials event-data catalog is empty or drifted')
        }
        def generatorSource = referenceGenerator.getText('UTF-8')
        if (!generatorSource.contains('"core": ("0F9D58", "0D904F")')
                || !generatorSource.contains('"action": ("FF9900", "B45F06")')
                || !generatorSource.contains('"event": ("00A6B8", "007C91")')
                || !generatorSource.contains('"geometry": ("5E35B1", "311B92")')
                || !generatorSource.contains('"overlay": ("AD1457", "6A1B4D")')
                || !generatorSource.contains('"decal": ("00796B", "004D40")')
                || !generatorSource.contains('"custom_projectile": ("1565C0", "0D47A1")')
                  || !generatorSource.contains('EVENT_INDEX_COLOR = "B2EBF2"')
                  || !generatorSource.contains('SHORTCUT_COLUMNS = 4')
                  || !generatorSource.contains('def inject_navigation_shapes(')
                || !generatorSource.contains('hlinkClick')
                || !generatorSource.contains('"--check"')) {
            throw new GradleException('INI Essentials reference generator lost section styling/navigation')
        }
        new java.util.zip.ZipFile(referenceWorkbook).withCloseable { zip ->
            def workbookXml = zip.getInputStream(zip.getEntry('xl/workbook.xml')).getText('UTF-8')
            def stylesXml = zip.getInputStream(zip.getEntry('xl/styles.xml')).getText('UTF-8')
            def sheetsXml = new StringBuilder()
            def drawingsXml = new StringBuilder()
            def drawingRelationshipsXml = new StringBuilder()
            zip.entries().each { entry ->
                if (entry.name.startsWith('xl/worksheets/sheet') && entry.name.endsWith('.xml')) {
                    sheetsXml.append(zip.getInputStream(entry).getText('UTF-8'))
                } else if (entry.name.startsWith('xl/drawings/drawing')
                        && entry.name.endsWith('.xml')) {
                    drawingsXml.append(zip.getInputStream(entry).getText('UTF-8'))
                } else if (entry.name.startsWith('xl/drawings/_rels/drawing')
                        && entry.name.endsWith('.xml.rels')) {
                    drawingRelationshipsXml.append(
                            zip.getInputStream(entry).getText('UTF-8'))
                }
            }
            def sheetText = sheetsXml.toString()
            def drawingText = drawingsXml.toString()
            def drawingRelationshipText = drawingRelationshipsXml.toString()
            def hyperlinkCount = (drawingText =~ /hlinkClick/).count
            if (!workbookXml.contains('name="English"')
                    || !workbookXml.contains('name="简体中文"')
                    || !['FF0F9D58', 'FF0D904F', 'FFFF9900', 'FFB45F06',
                          'FF5E35B1', 'FF311B92', 'FFAD1457', 'FF6A1B4D',
                          'FF1565C0', 'FF0D47A1'].every {
                        stylesXml.contains(it)
                    }
                    || hyperlinkCount < 72
                    || !drawingRelationshipText.contains('/relationships/hyperlink')
                    || !['#rf_en_core', '#rf_en_action', '#rf_zh_core',
                         '#rf_zh_action', '#rf_en_shortcuts', '#rf_zh_shortcuts',
                         '#rf_en_class_custom_unit', '#rf_zh_class_custom_unit',
                         '#rf_en_class_custom_projectile', '#rf_zh_class_custom_projectile',
                         '#rf_en_event_tookdamage', '#rf_zh_event_attachmentremoved',
                         '#rf_en_event_killedanyunit', '#rf_zh_event_newmessage'].every {
                        drawingRelationshipText.contains(it)
                    }
                    || !sheetText.contains('CustomUnitMetadata sections')
                    || !sheetText.contains('CustomProjectile sections')
                    || !sheetText.contains('CustomUnitMetadata 节导航')
                    || !sheetText.contains('CustomProjectile 节导航')
                    || !(expectedCodes + expectedEventData).every { sheetText.contains(it) }) {
                throw new GradleException(
                        'Generated INI Essentials workbook is stale or lost drawing links/colors')
            }
        }
        def mod = new groovy.json.JsonSlurper().parseText(metadata.getText('UTF-8'))
        def multiplayer = mod.custom?.get('rusted_fabric:multiplayer')
        byte[] canonicalSyncSchema = syncSchema.getText('UTF-8')
                .replace('\r\n', '\n').replace('\r', '\n')
                .getBytes(java.nio.charset.StandardCharsets.UTF_8)
        def digest = java.security.MessageDigest.getInstance('SHA-256')
                .digest(canonicalSyncSchema).encodeHex().toString()
        if (mod.id != 'ini_essentials' || multiplayer?.mode != 'optional'
                || multiplayer?.protocol != 'ini_essentials_v27'
                || multiplayer?.syncHash != digest
                || !initializerSource.contains('"' + digest + '"')) {
            throw new GradleException('INI Essentials multiplayer metadata does not match sync-schema.txt')
        }
    }
}

check.dependsOn tasks.named('verifyIniEssentialsMetadata')

tasks.register('remapJarToOfficial', JavaExec) {
    group = 'rusted fabric'
    description = 'Remaps INI Essentials from named names to official runtime names.'
    dependsOn jar, rootProject.tasks.named('classes'), rootProject.tasks.named('generateNamedGameJar')

    classpath = rootProject.sourceSets.main.runtimeClasspath
    mainClass.set('io.github.endx.rustedfabricloader.tools.RemapJar')

    def outputJar = layout.buildDirectory.file("libs/ini-essentials-${project.version}-official.jar")
    inputs.file(tasks.jar.archiveFile)
    inputs.file(provider { mappingsTinyFile() })
    inputs.file(provider { namedGameJarFile() })
    outputs.file outputJar

    doFirst {
        def output = outputJar.get().asFile
        output.parentFile.mkdirs()
        setArgs([
                tasks.jar.archiveFile.get().asFile.absolutePath,
                output.absolutePath,
                mappingsTinyFile().absolutePath,
                'named',
                'official',
                namedGameJarFile().absolutePath
        ] + sourceSets.main.compileClasspath.files.collect { it.absolutePath })
    }
}
