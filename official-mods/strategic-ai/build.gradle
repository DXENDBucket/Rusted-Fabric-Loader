plugins {
    id 'java'
}

group = 'io.github.endx'
version = rootProject.componentVersions.strategicAi

repositories {
    if (rootProject.hasProperty('offlineRuntimeJars')) {
        flatDir { dirs rootProject.file(rootProject.property('offlineRuntimeJars')) }
    } else {
        mavenCentral()
        maven { url = "https://maven.fabricmc.net/" }
    }
}

def namedGameJarFile = {
    rootProject.hasProperty('namedGameJar')
            ? rootProject.file(rootProject.property('namedGameJar'))
            : rootProject.layout.buildDirectory.file("rusted-dev/game-lib-named.jar").get().asFile
}

def mappingsTinyFile = {
    rootProject.hasProperty('mappingsTiny')
            ? rootProject.file(rootProject.property('mappingsTiny'))
            : rootProject.file("src/main/resources/mappings/mappings.tiny")
}

dependencies {
    compileOnly "net.fabricmc:fabric-loader:0.18.1"
    compileOnly project(":rusted-fabric-api")
    compileOnly files({ namedGameJarFile() })
}

tasks.withType(JavaCompile).configureEach {
    dependsOn rootProject.tasks.named('generateNamedGameJar')
    options.release = 13
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

jar {
    archiveBaseName.set("strategic-ai")
    from(rootProject.file('LICENSE')) {
        into 'META-INF'
        rename { 'LICENSE-rusted-fabric.txt' }
    }
}

tasks.register('verifyStrategicAi') {
    group = 'verification'
    dependsOn jar
    inputs.file(tasks.jar.archiveFile)
    doLast {
        new java.util.zip.ZipFile(tasks.jar.archiveFile.get().asFile).withCloseable { zip ->
            def mod = new groovy.json.JsonSlurper().parseText(
                    zip.getInputStream(zip.getEntry('fabric.mod.json')).getText('UTF-8'))
            if (mod.id != 'strategic_ai'
                    || mod.environment != '*'
                    || mod.custom?.get('rusted_fabric:multiplayer')?.mode != 'required'
                    || zip.getEntry('io/github/endx/strategicai/StrategicAiMod.class') == null
                    || zip.getEntry('io/github/endx/strategicai/StrategicAiController.class') == null
                    || zip.getEntry('strategic_ai/policy-v1.txt') == null) {
                throw new GradleException('Strategic AI artifact is incomplete')
            }
            byte[] policy = zip.getInputStream(zip.getEntry('strategic_ai/policy-v1.txt')).bytes
            String hash = java.security.MessageDigest.getInstance('SHA-256')
                    .digest(policy).collect { String.format('%02x', it & 0xff) }.join()
            if (mod.custom?.get('rusted_fabric:multiplayer')?.syncHash != hash) {
                throw new GradleException('Strategic AI synchronized policy hash is stale')
            }
        }
    }
}

tasks.register('verifyStandoffGeometry', JavaExec) {
    group = 'verification'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass.set('io.github.endx.strategicai.StandoffGeometryVerification')
}

check.dependsOn tasks.named('verifyStrategicAi')
check.dependsOn tasks.named('verifyStandoffGeometry')

tasks.register('remapJarToOfficial', JavaExec) {
    group = 'rusted fabric'
    description = 'Remaps Strategic AI from named names to official runtime names.'
    dependsOn jar, rootProject.tasks.named('classes'), rootProject.tasks.named('generateNamedGameJar')

    classpath = rootProject.sourceSets.main.runtimeClasspath
    mainClass.set('io.github.endx.rustedfabricloader.tools.RemapJar')

    def outputJar = layout.buildDirectory.file(
            "libs/strategic-ai-${project.version}-official.jar")
    inputs.file(tasks.jar.archiveFile)
    inputs.file(provider { mappingsTinyFile() })
    inputs.file(provider { namedGameJarFile() })
    outputs.file(outputJar)

    doFirst {
        def output = outputJar.get().asFile
        output.parentFile.mkdirs()
        setArgs([
                tasks.jar.archiveFile.get().asFile.absolutePath,
                output.absolutePath,
                mappingsTinyFile().absolutePath,
                'named',
                'official',
                namedGameJarFile().absolutePath
        ] + sourceSets.main.compileClasspath.files.collect { it.absolutePath })
    }
}
