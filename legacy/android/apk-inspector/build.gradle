plugins {
    id 'java'
    id 'application'
}

group = 'io.github.endx'
version = rootProject.version

application {
    mainClass.set('io.github.endx.rustedfabric.android.inspector.ApkInspectorMain')
}

tasks.withType(JavaCompile).configureEach {
    options.release = 13
    options.encoding = 'UTF-8'
}

tasks.register('verifyInspectorContracts', JavaExec) {
    group = 'verification'
    description = 'Runs dependency-free APK inspector parser, determinism, and privacy checks.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass.set('io.github.endx.rustedfabric.android.inspector.InspectorContractVerification')
}

tasks.register('verifyNoGamePayload') {
    group = 'verification'
    description = 'Rejects APK, DEX, and Rusted Warfare game class payloads from inspector artifacts.'
    dependsOn jar
    inputs.file(tasks.jar.archiveFile)

    doLast {
        def archive = tasks.jar.archiveFile.get().asFile
        def forbidden = []
        new java.util.zip.ZipFile(archive).withCloseable { zip ->
            zip.entries().each { entry ->
                def name = entry.name.toLowerCase(Locale.ROOT)
                if (name.endsWith('.apk') || name.endsWith('.dex')
                        || name.startsWith('com/corrodinggames/')) {
                    forbidden.add(entry.name)
                }
            }
        }
        if (!forbidden.isEmpty()) {
            throw new GradleException("Inspector artifact contains forbidden game payloads: ${forbidden}")
        }
    }
}

tasks.register('verifyFinalAndroidMapping') {
    group = 'verification'
    description = 'Verifies the imported Android 1.15 vc176 mapping handoff and API inputs.'

    def profileDir = rootProject.file('android/mappings/rw-android-1.15-code176-v1.0')
    def expectedFiles = [
            'mappings.tiny': '7df59d61092a7665f023242b0221baf3ba5a3e8a3f2415bfd85a247070676d07',
            'mappings-strict.tiny': 'c336cc01392b244e026350a1d0a3bf92fd5791b6ef872dbb5d0d0334ce6b7d7b',
            'mapping-table.csv': '814c18d8f3804f3a68e3c21109205f6ea3a4c51b9e51a40f4648253c8c586e3b',
            'pc-android-class-crosswalk.csv': '44aeee8de31025bc7a1a2d1bf6eaaa1a48a318b3336c219267b999949b103339',
            'optimizer-alias-collisions.csv': 'd0fd17393172179ab07e04e2ae5934db607cab4e46369d6804ef9393177a94be'
    ]
    inputs.files(expectedFiles.keySet().collect { new File(profileDir, it) })
    inputs.file(new File(profileDir, 'profile.properties'))

    doLast {
        def sha256 = { File file ->
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            file.withInputStream { input ->
                byte[] buffer = new byte[8192]
                for (int read = input.read(buffer); read >= 0; read = input.read(buffer)) {
                    if (read > 0) digest.update(buffer, 0, read)
                }
            }
            digest.digest().encodeHex().toString()
        }

        expectedFiles.each { name, expected ->
            def file = new File(profileDir, name)
            if (!file.isFile() || sha256(file) != expected) {
                throw new GradleException("Android mapping handoff checksum mismatch: ${name}")
            }
        }

        def countTiny = { File file ->
            int classes = 0
            int members = 0
            int lineNumber = 0
            file.eachLine('UTF-8') { line ->
                lineNumber++
                if (lineNumber == 1 && line != 'tiny\t2\t0\tofficial\tintermediary\tnamed') {
                    throw new GradleException("Unexpected Android Tiny header in ${file.name}")
                }
                if (line.startsWith('c\t')) classes++
                if (line.startsWith('\tf\t') || line.startsWith('\tm\t')) members++
            }
            [classes, members]
        }
        if (countTiny(new File(profileDir, 'mappings.tiny')) != [1602, 9213]) {
            throw new GradleException('Android runtime mapping row counts changed')
        }
        if (countTiny(new File(profileDir, 'mappings-strict.tiny')) != [1585, 9213]) {
            throw new GradleException('Android strict API mapping row counts changed')
        }

        def profile = new Properties()
        new File(profileDir, 'profile.properties').withInputStream { profile.load(it) }
        def hookOwner = profile.getProperty('hook.gameEngineInit.owner')
        def hookName = profile.getProperty('hook.gameEngineInit.name')
        def hookDescriptor = profile.getProperty('hook.gameEngineInit.descriptor')
        def hookNamed = profile.getProperty('hook.gameEngineInit.named')
        def currentOwner = null
        def hookFound = false
        new File(profileDir, 'mappings.tiny').eachLine('UTF-8') { line ->
            if (line.startsWith('c\t')) {
                currentOwner = line.split('\t', -1)[1]
            } else if (currentOwner == hookOwner && line.startsWith('\tm\t')) {
                def parts = line.split('\t', -1)
                if (parts[2] == hookDescriptor && parts[3] == hookName && parts[5] == hookNamed) {
                    hookFound = true
                }
            }
        }
        if (!hookFound) {
            throw new GradleException('GameEngine initialization hook is not present in the pinned mapping')
        }

        def forbidden = fileTree(profileDir) {
            include '**/*.apk', '**/*.dex', '**/*.so', '**/*.class', '**/*.jar', '**/*.xml'
        }.files
        if (!forbidden.isEmpty()) {
            throw new GradleException("Android mapping profile contains forbidden payloads: ${forbidden*.name}")
        }
        logger.lifecycle('Verified Android 1.15 vc176 mapping: 1602 classes / 9213 loader-safe members')
    }
}

check.dependsOn tasks.named('verifyInspectorContracts')
check.dependsOn tasks.named('verifyNoGamePayload')
check.dependsOn tasks.named('verifyFinalAndroidMapping')

tasks.register('inspectReferenceApk', JavaExec) {
    group = 'rusted fabric android'
    description = 'Inspects the ignored local Android reference APK without embedding it in any artifact.'
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass.set(application.mainClass)

    def apk = rootProject.file('libs/android/rusted-warfare-1.15-code176-base.apk')
    def profiles = rootProject.file('android/mappings')
    def report = layout.buildDirectory.file('reports/reference-apk-compatibility.json')
    inputs.file(apk)
    inputs.dir(profiles)
    outputs.file(report)

    doFirst {
        if (!apk.isFile()) {
            throw new GradleException("Missing ignored local reference APK: ${apk}")
        }
        args = [
                '--apk', apk.absolutePath,
                '--profiles', profiles.absolutePath,
                '--output', report.get().asFile.absolutePath
        ]
    }
}
